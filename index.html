<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>かぜはしり</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1030;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// =====================================================================
//  かぜはしり — 走るのが気持ちいい横スクロールランゲーム
// =====================================================================
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
}
addEventListener('resize', resize); resize();

const FONT = 'system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif';
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const hash = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

// ---------------------------------------------------------------- 定数
const G = 2600, JUMP_V = 940, DJUMP_V = 860;
const STAND_H = 76, SLIDE_H = 32, AIR_H = 62, HW = 14;
const U_PER_M = 40;              // 40ユニット = 1m
const KMH = 0.09;                // ユニット/秒 → km/h 表示

let best = 0;
try { best = +localStorage.getItem('kazehashiri_best') || 0; } catch (e) {}
function saveBest() { try { localStorage.setItem('kazehashiri_best', String(best)); } catch (e) {} }

// ---------------------------------------------------------------- 入力
const input = { jumpPressed: false, jumpKey: false, downKey: false, jumpTouch: 0, downTouch: 0,
  get jumpHeld() { return this.jumpKey || this.jumpTouch > 0; },
  get downHeld() { return this.downKey || this.downTouch > 0; } };
let isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

// ---------------------------------------------------------------- 状態
let state = 'title', time = 0, stateT = 0, hitStop = 0;
let P, cam, plats, obs, orbs, pads, parts, popups, lines, trail, scarf;
let maxSpd, combo, comboT, maxCombo, shake, flash, flashCol, genX, genY, segCount, lastGroundY, boostT, trailT, speedStage;

function reset() {
  P = { x: 0, y: 0, vx: 0, vy: 0, ground: true, coyote: 0, buffer: 0, jumps: 0, slide: false, dive: false,
        flipT: -1, stumble: 0, inv: 0, phase: 0, land: 0, airT: 0, blocked: false, pose: null };
  cam = { x: 260, y: -90, off: 260, zoom: 1 };
  plats = [{ x0: -3000, x1: 2200, y: 0 }];
  obs = []; orbs = []; pads = []; parts = []; popups = []; lines = []; trail = [];
  genX = 2200; genY = 0; segCount = 0; maxSpd = 0; combo = 0; comboT = 0; maxCombo = 0;
  shake = 0; flash = 0; flashCol = '#fff'; lastGroundY = 0; boostT = 0; trailT = 0; speedStage = 0;
  scarf = []; for (let i = 0; i < 10; i++) scarf.push({ x: -i * 7, y: -66, px: -i * 7, py: -66 });
  // スタート直後の道にオーブを並べておく
  for (let i = 0; i < 8; i++) orbs.push({ x: 700 + i * 55, y: -34, got: false, mag: false });
  for (let i = 0; i < 7; i++) { const t = 0.08 + i * 0.09; orbs.push({ x: 1450 + 700 * t, y: -(JUMP_V * t - 0.5 * G * t * t) - 36, got: false, mag: false }); }
  pads.push({ x: 1150, y: 0, w: 130, used: false });
}

const baseSpeedAt = x => 600 + 760 * (1 - Math.exp(-Math.max(0, x) / 42000));
const baseSpeed = () => baseSpeedAt(P.x);

// ---------------------------------------------------------------- コース生成
function arcOrbs(tx, ty, s, t0, t1, n) {
  for (let i = 0; i < n; i++) {
    const t = lerp(t0, t1, i / (n - 1));
    orbs.push({ x: tx + s * t, y: ty - (JUMP_V * t - 0.5 * G * t * t) - 36, got: false, mag: false });
  }
}
function genSeg() {
  segCount++;
  const s = baseSpeedAt(genX);
  const diff = clamp(genX / 70000, 0, 1);
  let gap = 0, dy = 0;
  const r = Math.random();
  if (r < 0.45 + diff * 0.2) {
    const upP = 0.35 + clamp(genY / 360, -1, 1) * 0.3;
    dy = Math.random() < upP ? -rand(30, 105) : rand(0, 170);
    gap = s * rand(0.18, dy < 0 ? 0.3 : 0.48);
  } else if (r < 0.75) {
    dy = rand(50, 150);
  }
  let ny = clamp(genY + dy, -380, 380);
  if (gap === 0 && ny < genY) ny = genY;
  const len = s * rand(1.0, 2.3);
  const x0 = genX + gap, x1 = x0 + len;
  plats.push({ x0, x1, y: ny });

  if (gap > 0) arcOrbs(genX - s * 0.1, genY, s, 0.1, 0.55, 6);

  // 障害物
  const a = x0 + s * 0.5, b = x1 - s * 0.45;
  let placed = false;
  if (b > a && Math.random() < 0.5 + diff * 0.35) {
    const two = b - a > s * 1.1 && Math.random() < 0.3 + diff * 0.4;
    const xs = two ? [a + rand(0, (b - a) * 0.3), b - rand(0, (b - a) * 0.2)] : [rand(a, b)];
    for (const ox of xs) {
      if (Math.random() < 0.6) {
        obs.push({ type: 'h', x: ox, y: ny, w: 32, top: ny - 44, bot: ny, hit: false, passed: false, rot: 0, vx: 0, vy: 0, av: 0, dx: 0, dy: 0 });
        arcOrbs(ox + 16 - s * 0.36, ny, s, 0.14, 0.58, 5);
      } else {
        obs.push({ type: 'b', x: ox, y: ny, w: 96, top: ny - 210, bot: ny - 48, hit: false, passed: false, rot: 0, vx: 0, vy: 0, av: 0, dx: 0, dy: 0 });
        for (let i = 0; i < 4; i++) orbs.push({ x: ox - 30 + i * 52, y: ny - 18, got: false, mag: false });
      }
    }
    placed = true;
  }
  if (!placed && len > s * 1.2) {
    if (Math.random() < 0.35) pads.push({ x: x0 + len * rand(0.25, 0.45), y: ny, w: 130, used: false });
    else { const ox = x0 + len * 0.3; for (let i = 0; i < 6; i++) orbs.push({ x: ox + i * 55, y: ny - 34 - Math.sin(i / 5 * Math.PI) * 40, got: false, mag: false }); }
  }
  genX = x1; genY = ny;
}

// ---------------------------------------------------------------- オーディオ
let AC = null, master, sfxBus, musicBus, noiseBuf, windGain, windFilt, muted = false, nextNote = 0, step = 0;
try { muted = localStorage.getItem('kazehashiri_mute') === '1'; } catch (e) {}
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; return; }
  const comp = AC.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 4; comp.connect(AC.destination);
  master = AC.createGain(); master.gain.value = muted ? 0 : 0.7; master.connect(comp);
  sfxBus = AC.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
  musicBus = AC.createGain(); musicBus.gain.value = 0; musicBus.connect(master);
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const ws = AC.createBufferSource(); ws.buffer = noiseBuf; ws.loop = true;
  windFilt = AC.createBiquadFilter(); windFilt.type = 'bandpass'; windFilt.frequency.value = 500; windFilt.Q.value = 0.6;
  windGain = AC.createGain(); windGain.gain.value = 0;
  ws.connect(windFilt); windFilt.connect(windGain); windGain.connect(master); ws.start();
}
function env(g, t, a, d, v) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
}
function tone(f, d, o = {}) {
  if (!AC) return;
  const t = o.t ?? AC.currentTime, a = o.a ?? 0.005;
  const osc = AC.createOscillator(), g = AC.createGain();
  osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + a + d);
  env(g, t, a, d, o.v ?? 0.2);
  osc.connect(g); g.connect(o.dest || sfxBus); osc.start(t); osc.stop(t + a + d + 0.05);
}
function noise(d, o = {}) {
  if (!AC) return;
  const t = o.t ?? AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const fl = AC.createBiquadFilter(); fl.type = o.type || 'bandpass'; fl.Q.value = o.q ?? 1;
  fl.frequency.setValueAtTime(o.f ?? 1000, t);
  if (o.to) fl.frequency.exponentialRampToValueAtTime(o.to, t + d);
  const g = AC.createGain(); env(g, t, o.a ?? 0.003, d, o.v ?? 0.2);
  s.connect(fl); fl.connect(g); g.connect(o.dest || sfxBus);
  s.start(t, Math.random() * 1.5); s.stop(t + d + 0.05);
}
const SFX = {
  step(k) { noise(0.045, { f: 1800 + Math.random() * 900, q: 1.3, v: 0.07 + 0.04 * k }); tone(95, 0.05, { to: 50, v: 0.12 }); },
  jump() { tone(300, 0.16, { type: 'triangle', to: 700, v: 0.16 }); noise(0.12, { type: 'highpass', f: 2500, to: 6000, v: 0.05 }); },
  djump() { tone(460, 0.2, { type: 'triangle', to: 1200, v: 0.15 }); tone(920, 0.25, { to: 1800, v: 0.05, t: AC && AC.currentTime + 0.04 }); noise(0.25, { f: 800, to: 4000, q: 1.5, v: 0.12 }); },
  land(k) { noise(0.12, { type: 'lowpass', f: 500, v: 0.12 + 0.25 * k }); tone(120, 0.12, { to: 45, v: 0.15 + 0.25 * k }); },
  orb(c) {
    const sc = [0, 2, 4, 7, 9], i = Math.min(c, 14);
    const f = 523.25 * Math.pow(2, sc[i % 5] / 12 + Math.floor(i / 5));
    tone(f, 0.16, { v: 0.13 }); tone(f * 2, 0.09, { type: 'triangle', v: 0.04 });
  },
  hit() { noise(0.3, { type: 'lowpass', f: 600, to: 150, v: 0.45 }); tone(220, 0.3, { type: 'sawtooth', to: 55, v: 0.12 }); },
  wall() { noise(0.18, { type: 'lowpass', f: 300, v: 0.4 }); tone(90, 0.2, { to: 40, v: 0.3 }); },
  boost() { noise(0.6, { f: 400, to: 5000, q: 2.5, v: 0.28 }); tone(260, 0.5, { type: 'sawtooth', to: 1000, v: 0.06 }); tone(523, 0.3, { type: 'triangle', v: 0.08, t: AC && AC.currentTime + 0.1 }); },
  nice() { tone(988, 0.07, { type: 'triangle', v: 0.1 }); tone(1480, 0.12, { type: 'triangle', v: 0.09, t: AC && AC.currentTime + 0.06 }); },
  slide() { noise(0.3, { type: 'highpass', f: 1200, v: 0.07 }); },
  dive() { noise(0.25, { f: 3000, to: 600, q: 2, v: 0.12 }); },
  stage() { [0, 4, 7, 12].forEach((n, i) => tone(523.25 * Math.pow(2, n / 12), 0.2, { type: 'triangle', v: 0.09, t: AC && AC.currentTime + i * 0.07 })); },
  over() { tone(440, 0.7, { type: 'triangle', to: 110, v: 0.2 }); noise(0.6, { f: 2000, to: 200, v: 0.1 }); },
  start() { noise(0.4, { f: 300, to: 3000, q: 1.5, v: 0.2 }); tone(392, 0.12, { type: 'triangle', v: 0.12 }); tone(784, 0.25, { type: 'triangle', v: 0.12, t: AC && AC.currentTime + 0.1 }); },
};
// 簡単な自動演奏(スピードに合わせてテンポと音数が上がる)
const CHORDS = [[0, 3, 7], [-4, 0, 3], [3, 7, 10], [-2, 2, 5]]; // Am F C G
function scheduleNote(i, t, sp, spdN) {
  const s = i % 16, ch = CHORDS[Math.floor(i / 16) % 4];
  const D = musicBus;
  if (s % 4 === 0) tone(150, 0.2, { to: 42, v: 0.5, t, dest: D });
  if (s === 4 || s === 12) noise(0.14, { f: 1800, q: 0.7, v: 0.16, t, dest: D });
  if (s % 4 === 2) noise(0.04, { type: 'highpass', f: 7500, v: 0.1, t, dest: D });
  else if (spdN > 0.45 && s % 2 === 1) noise(0.025, { type: 'highpass', f: 9000, v: 0.04, t, dest: D });
  if ([0, 3, 6, 8, 11, 14].includes(s)) tone(110 * Math.pow(2, ch[0] / 12) * (s === 8 ? 2 : 1), sp * 1.5, { type: 'triangle', v: 0.22, t, dest: D });
  if (spdN > 0.3) {
    const notes = [ch[0], ch[1], ch[2], ch[0] + 12, ch[1] + 12, ch[2] + 12];
    const seq = [0, 1, 2, 3, 4, 3, 2, 1];
    const n = notes[seq[s % 8]] + 12;
    tone(220 * Math.pow(2, n / 12), sp * 0.8, { type: 'triangle', v: 0.05 * clamp((spdN - 0.3) * 2, 0, 1), t, dest: D });
  }
}
function updateAudio(spdN) {
  if (!AC) return;
  const now = AC.currentTime;
  master.gain.setTargetAtTime(muted ? 0 : 0.7, now, 0.05);
  windGain.gain.setTargetAtTime(state === 'play' ? 0.03 + spdN * 0.13 : 0.015, now, 0.15);
  windFilt.frequency.setTargetAtTime(350 + spdN * 900, now, 0.2);
  const playing = state === 'play';
  musicBus.gain.setTargetAtTime(playing ? 0.42 : 0, now, playing ? 0.4 : 0.6);
  if (!playing) return;
  const sp = 60 / (120 + spdN * 28) / 4;
  if (nextNote < now) nextNote = now + 0.03;
  while (nextNote < now + 0.12) { scheduleNote(step, nextNote, sp, spdN); nextNote += sp; step++; }
}

// ---------------------------------------------------------------- エフェクト
function puff(x, y, n, o = {}) {
  for (let i = 0; i < n; i++) {
    const a = (o.a ?? -Math.PI / 2) + rand(-1, 1) * (o.spread ?? 1.2);
    const v = rand(0.4, 1) * (o.v ?? 200);
    parts.push({ x: x + rand(-6, 6), y: y + rand(-3, 3), vx: Math.cos(a) * v + (o.vx ?? 0), vy: Math.sin(a) * v,
      life: 0, max: rand(0.3, 0.7) * (o.life ?? 1), size: rand(3, 7) * (o.size ?? 1), col: o.col || 'dust', g: o.g ?? 300, drag: o.drag ?? 3 });
  }
}
function popup(x, y, text, col = '#fff', size = 26) { y -= popups.filter(p => p.life < 0.4).length * 34; popups.push({ x, y, text, col, size, life: 0 }); }
function addBoost(v, text, col) {
  P.vx += v; boostT = Math.max(boostT, 0.35);
  if (text) popup(P.x + 20, P.y - 100, text, col || '#7df9ff', 24);
}

// ---------------------------------------------------------------- プレイヤー
function doJump(double) {
  if (double) {
    P.vy = -DJUMP_V; P.jumps = 2; P.flipT = 0;
    for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2; parts.push({ x: P.x, y: P.y - 20, vx: Math.cos(a) * 260 + P.vx * 0.3, vy: Math.sin(a) * 120 + 80, life: 0, max: 0.4, size: 4, col: 'ring', g: 0, drag: 4 }); }
    SFX.djump();
  } else {
    P.vy = -JUMP_V; P.jumps = 1;
    puff(P.x - 6, P.y, 8, { a: Math.PI * 1.15, v: 220, vx: -P.vx * 0.15 });
    SFX.jump();
  }
  P.ground = false; P.coyote = 0; P.buffer = 0; P.slide = false; P.dive = false; P.airT = 0;
}
function land(p) {
  const impact = P.vy;
  P.y = p.y; P.vy = 0; P.ground = true; P.jumps = 0; P.flipT = -1; lastGroundY = p.y;
  const k = clamp(impact / 1800, 0, 1);
  P.land = Math.max(P.land, 0.3 + k * 0.7);
  puff(P.x, P.y, 5 + (k * 12 | 0), { a: -Math.PI / 2, spread: 1.5, v: 120 + k * 260, vx: P.vx * 0.15 });
  if (P.dive) {
    addBoost(140, 'ダイブ着地!', '#ffd23f');
    shake = Math.max(shake, 9); flash = 0.25; flashCol = '#ffd23f';
    puff(P.x, P.y, 16, { a: Math.PI, spread: 0.4, v: 520, col: 'spark', g: 0, life: 0.8 });
    SFX.land(1); SFX.nice();
  } else {
    if (impact > 1300) shake = Math.max(shake, 4);
    SFX.land(k);
  }
  P.dive = false; P.airT = 0;
}
function hitObstacle(o) {
  o.hit = true; o.vx = P.vx * 0.7 + 200; o.vy = -rand(500, 750); o.av = rand(6, 12);
  P.vx = Math.max(280, P.vx * 0.55); P.stumble = 0.55; P.inv = 0.9; boostT = 0;
  shake = 14; hitStop = 0.07; flash = 0.2; flashCol = '#ff4d6d';
  if (combo >= 5) popup(P.x, P.y - 110, 'コンボ途切れ…', '#ff8fa3', 20);
  combo = 0;
  puff((o.x + P.x) / 2, (o.top + o.bot) / 2, 18, { a: -0.6, spread: 1.6, v: 420, col: o.type === 'h' ? 'wood' : 'sign', g: 1200, life: 1.2 });
  SFX.hit();
}
function hitWall() {
  P.vx = Math.min(P.vx * 0.3, 220); P.stumble = 0.4; shake = 10; hitStop = 0.05; boostT = 0; combo = 0;
  puff(P.x + HW, P.y - 30, 12, { a: Math.PI, spread: 1, v: 260 });
  SFX.wall();
}

function updatePlay(dt) {
  const bs = baseSpeed();
  if (P.stumble > 0) P.stumble -= dt;
  if (P.inv > 0) P.inv -= dt;
  if (boostT > 0) boostT -= dt;
  // スピード
  if (P.vx < bs) P.vx = Math.min(bs, P.vx + (P.vx < 380 ? 1100 : 300) * dt);
  else if (boostT <= 0) P.vx = Math.max(bs, P.vx - (120 + (P.vx - bs) * 0.6) * dt);
  P.vx = Math.min(P.vx, 2300);
  maxSpd = Math.max(maxSpd, P.vx);

  // ジャンプ
  if (input.jumpPressed) { P.buffer = 0.13; input.jumpPressed = false; }
  P.buffer -= dt; P.coyote -= dt;
  if (P.buffer > 0) {
    if (P.ground || P.coyote > 0) doJump(false);
    else if (P.jumps < 2) doJump(true);
  }
  // 重力
  if (!P.ground) {
    let g = G;
    if (P.vy < 0 && !input.jumpHeld) g *= 2.4;          // 短押しで小ジャンプ
    if (input.downHeld) {
      g *= 2.2;
      if (!P.dive && P.airT > 0.05) { P.dive = true; P.vy = Math.max(P.vy, 600); P.flipT = -1; SFX.dive(); }
    }
    P.vy = Math.min(P.vy + g * dt, P.dive ? 2600 : 1700);
    P.airT += dt;
    if (P.flipT >= 0) { P.flipT += dt / 0.42; if (P.flipT >= 1) P.flipT = -1; }
  }
  // スライド
  const wasSlide = P.slide;
  const underBar = obs.some(o => o.type === 'b' && !o.hit && P.x + HW + 30 > o.x && P.x - HW < o.x + o.w);
  P.slide = P.ground && (input.downHeld || (wasSlide && underBar));
  if (P.slide && !wasSlide) { SFX.slide(); puff(P.x + 10, P.y, 6, { a: -2.6, spread: 0.4, v: 240 }); }
  if (P.slide && Math.random() < dt * 40) parts.push({ x: P.x + 18, y: P.y - 2, vx: rand(-200, 50), vy: rand(-250, -60), life: 0, max: 0.3, size: 2.5, col: 'spark', g: 900, drag: 1 });

  // 横移動 & 壁
  const ox = P.x;
  P.x += P.vx * dt;
  P.blocked = false;
  for (const p of plats) {
    if (p.x0 >= ox + HW - 1 && p.x0 < P.x + HW && p.y < P.y - 0.5) {
      if (P.y - p.y <= 30) { P.y = p.y; if (!P.ground) land(p); }
      else {
        const touching = ox + HW >= p.x0 - 0.5;
        P.x = p.x0 - HW; P.blocked = true;
        if (!touching) hitWall(); else P.vx = Math.min(P.vx, 240);
      }
    }
  }
  // 縦移動
  const oy = P.y;
  if (!P.ground) {
    P.y += P.vy * dt;
    if (P.vy >= 0) {
      let target = null;
      for (const p of plats) if (P.x + HW > p.x0 && P.x - HW < p.x1 && oy <= p.y + 1 && P.y >= p.y && (!target || p.y < target.y)) target = p;
      if (target) land(target);
    }
  } else {
    let sup = false;
    for (const p of plats) if (P.x - HW * 0.5 < p.x1 && P.x + HW > p.x0 && Math.abs(p.y - P.y) < 1.5) { sup = true; break; }
    if (!sup) { P.ground = false; P.coyote = 0.1; P.jumps = 0; P.airT = 0; P.vy = 0; P.slide = false; }
  }

  // 走りアニメの位相 & 足音
  if (P.ground && !P.slide) {
    const stride = 80 + P.vx * 0.06;
    const before = Math.floor(P.phase / Math.PI);
    P.phase += (P.x - ox) / stride * Math.PI;
    if (Math.floor(P.phase / Math.PI) !== before) {
      SFX.step(clamp(P.vx / 1500, 0, 1));
      puff(P.x - 8, P.y, P.vx > 1000 ? 3 : 1, { a: -2.5, spread: 0.5, v: 90 + P.vx * 0.1, size: 0.8, life: 0.7 });
    }
  }
  if (P.land > 0) P.land = Math.max(0, P.land - dt * 4);

  // 障害物
  const ph = P.slide ? SLIDE_H : (P.ground ? STAND_H : AIR_H);
  for (const o of obs) {
    if (o.hit) { o.vy += 1800 * dt; o.dx += o.vx * dt; o.dy += o.vy * dt; o.rot += o.av * dt; continue; }
    if (P.x + HW > o.x && P.x - HW < o.x + o.w && P.y > o.top && P.y - ph < o.bot) {
      if (P.inv <= 0) hitObstacle(o);
    } else if (!o.passed && P.x - HW > o.x + o.w) {
      o.passed = true;
      if (P.inv <= 0) { addBoost(40, o.type === 'b' ? 'くぐった!' : 'ナイス!', '#b8ff6e'); SFX.nice(); }
    }
  }
  // オーブ
  const cx = P.x, cy = P.y - ph / 2;
  for (const o of orbs) {
    if (o.got) continue;
    const dx = cx - o.x, dy = cy - o.y, d2 = dx * dx + dy * dy;
    if (d2 < 130 * 130) o.mag = true;
    if (o.mag) { const d = Math.sqrt(d2) || 1, sp = Math.max(900, P.vx * 1.4) * dt; o.x += dx / d * Math.min(sp, d) + P.vx * dt * 0.6; o.y += dy / d * Math.min(sp, d); }
    if (d2 < 40 * 40) {
      o.got = true; combo++; comboT = 2.2; maxCombo = Math.max(maxCombo, combo);
      P.vx += 9;
      SFX.orb(combo - 1);
      for (let i = 0; i < 6; i++) parts.push({ x: o.x, y: o.y, vx: rand(-200, 200) + P.vx * 0.5, vy: rand(-200, 200), life: 0, max: 0.35, size: 3, col: 'spark', g: 0, drag: 5 });
      if (combo % 10 === 0) { popup(P.x, P.y - 110, combo + ' コンボ!', '#7df9ff', 28); addBoost(60); SFX.nice(); }
    }
  }
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }
  // ブーストパッド
  for (const pd of pads) {
    if (!pd.used && P.ground && Math.abs(P.y - pd.y) < 2 && P.x > pd.x && P.x < pd.x + pd.w + P.vx * dt) {
      pd.used = true;
      P.vx = Math.max(P.vx, bs + 560); boostT = 0.9;
      shake = Math.max(shake, 6); flash = 0.35; flashCol = '#7df9ff'; hitStop = 0.03;
      popup(P.x + 30, P.y - 110, 'ブースト!!', '#7df9ff', 34);
      puff(P.x, P.y, 20, { a: Math.PI, spread: 0.3, v: 700, col: 'spark', g: 0, life: 0.7 });
      SFX.boost();
    }
  }
  // スピード到達演出
  const kmh = P.vx * KMH;
  const stages = [100, 150, 200];
  if (speedStage < stages.length && kmh >= stages[speedStage]) {
    popup(P.x + 60, P.y - 140, stages[speedStage] + 'km/h 突破!', '#ffd23f', 30);
    speedStage++; SFX.stage(); flash = Math.max(flash, 0.15); flashCol = '#ffd23f';
  }
  // 残像
  trailT -= dt;
  if ((P.vx > bs + 120 || P.vx > 1150) && trailT <= 0) {
    trailT = 0.03;
    trail.push({ ...poseState(), life: 0 });
  }
  // 落下
  if (!P.ground && P.y > lastGroundY + 900) gameOver();

  // コース生成 & 掃除
  while (genX < P.x + 5000) genSeg();
  const left = cam.x - 2500;
  if (plats.length > 6 && plats[0].x1 < left) plats.shift();
  obs = obs.filter(o => o.x > left && o.dy < 3000);
  orbs = orbs.filter(o => o.x > left && !o.got);
  pads = pads.filter(p => p.x > left);
}

function poseState() {
  let mode = 'run';
  if (state === 'title' || (state === 'play' && P.vx < 5 && P.ground)) mode = 'idle';
  else if (P.slide) mode = 'slide';
  else if (!P.ground) mode = P.dive ? 'dive' : 'air';
  return { x: P.x, y: P.y, phase: P.phase, mode, vy: P.vy, flipT: P.flipT, land: P.land,
           stumble: P.stumble, spd: clamp((P.vx - 400) / 1000, 0, 1), t: time };
}

// 関節位置を計算(0=真下、正=前方向への回転)
function computePose(s) {
  let hipY = -44, ta = 0.2, legs, arms;
  const sp = s.spd;
  if (s.mode === 'idle') {
    const b = Math.sin(s.t * 2.5) * 1.2;
    hipY = -44 + b; ta = 0.04;
    legs = [[0.08, 0.02], [-0.08, -0.02]];
    arms = [[0.12, 0.35], [-0.1, 0.15]];
  } else if (s.mode === 'slide') {
    hipY = -15; ta = -1.0;
    legs = [[1.5, 1.6], [0.7, -0.6]];
    arms = [[-2.4, -2.0], [0.4, 1.2]];
  } else if (s.mode === 'dive') {
    hipY = -44; ta = 0.55;
    legs = [[0.3, -0.3], [-0.1, -0.5]];
    arms = [[-2.6, -2.9], [-2.3, -2.6]];
  } else if (s.mode === 'air') {
    ta = 0.18 + sp * 0.15;
    if (s.flipT >= 0) {
      legs = [[1.9, 0.2], [1.6, 0.0]];
      arms = [[1.6, 2.4], [1.2, 2.2]];
    } else if (s.vy < 0) {
      legs = [[1.1, 0.0], [-0.6, -1.5]];
      arms = [[-0.9, 0.2], [1.6, 2.6]];
    } else {
      const f = clamp(s.vy / 900, 0, 1);
      legs = [[lerp(1.0, 0.6, f), lerp(0.1, 0.1, f)], [lerp(-0.5, 0.0, f), lerp(-1.4, -0.7, f)]];
      arms = [[lerp(-0.6, 1.8, f), lerp(0.4, 2.6, f)], [lerp(1.4, -0.8, f), lerp(2.4, -0.2, f)]];
    }
  } else {
    ta = 0.2 + sp * 0.28;
    hipY = -44 + Math.cos(s.phase * 2) * 2.5;
    const amp = 0.75 + sp * 0.25;
    legs = [0, 1].map(k => {
      const q = s.phase + k * Math.PI;
      const th = Math.sin(q) * amp + 0.12;
      const bend = 0.25 + (1.2 + sp * 0.5) * Math.max(0, Math.cos(q));
      return [th, th - bend];
    });
    arms = [1, 0].map(k => {
      const q = s.phase + k * Math.PI;
      const up = Math.sin(q) * (0.8 + sp * 0.3);
      return [up, up + 1.5];
    });
  }
  if (s.stumble > 0) ta += 0.45 + Math.sin(s.t * 40) * 0.15;
  hipY += s.land * 10;
  const hip = { x: 0, y: hipY };
  const up = (a, l, o) => ({ x: o.x + Math.sin(a) * l, y: o.y - Math.cos(a) * l });
  const dn = (a, l, o) => ({ x: o.x + Math.sin(a) * l, y: o.y + Math.cos(a) * l });
  const sh = up(ta, 26 - s.land * 3, hip), head = up(ta, 39 - s.land * 3, hip);
  const L = legs.map(([a, b]) => { const k = dn(a, 22, hip); return [hip, k, dn(b, 23, k)]; });
  const A = arms.map(([a, b]) => { const e = dn(a, 15, sh); return [sh, e, dn(b, 15, e)]; });
  const pose = { hip, sh, head, L, A };
  if (s.flipT >= 0) {
    const r = s.flipT * Math.PI * 2, c = Math.cos(r), sn = Math.sin(r), px = 0, py = -40;
    const rot = p => { const dx = p.x - px, dy = p.y - py; return { x: px + dx * c - dy * sn, y: py + dx * sn + dy * c }; };
    pose.hip = rot(hip); pose.sh = rot(sh); pose.head = rot(head);
    pose.L = L.map(l => l.map(rot)); pose.A = A.map(l => l.map(rot));
  }
  return pose;
}

function drawRunner(s, col, back, alpha = 1) {
  const pose = computePose(s);
  ctx.save(); ctx.translate(s.x, s.y); ctx.globalAlpha = alpha;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const limb = (pts, w, c) => { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); ctx.lineTo(pts[1].x, pts[1].y); ctx.lineTo(pts[2].x, pts[2].y); ctx.stroke(); };
  limb(pose.L[1], 7.5, back); limb(pose.A[1], 6, back);
  ctx.strokeStyle = col; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.moveTo(pose.hip.x, pose.hip.y); ctx.lineTo(pose.sh.x, pose.sh.y); ctx.stroke();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(pose.head.x, pose.head.y, 10, 0, Math.PI * 2); ctx.fill();
  limb(pose.L[0], 7.5, col); limb(pose.A[0], 6, col);
  ctx.restore();
  return pose;
}

function updateScarf(dt, pose) {
  const ax = P.x + lerp(pose.sh.x, pose.head.x, 0.35), ay = P.y + lerp(pose.sh.y, pose.head.y, 0.35);
  scarf[0].x = ax; scarf[0].y = ay; scarf[0].px = ax; scarf[0].py = ay;
  const spdN = clamp(P.vx / 1300, 0, 1.5);
  for (let i = 1; i < scarf.length; i++) {
    const p = scarf[i];
    const vx = (p.x - p.px) * 0.86, vy = (p.y - p.py) * 0.86;
    p.px = p.x; p.py = p.y;
    const flutter = Math.sin(time * (12 + spdN * 14) - i * 0.8) * (2500 + spdN * 9000) * (i / scarf.length);
    p.x += vx - 30 * dt * 60 * (state === 'title' ? 0.15 : 0.02);
    p.y += vy + (900 - spdN * 500 + flutter) * dt * dt;
  }
  const seg = 7.5;
  for (let it = 0; it < 4; it++) {
    for (let i = 1; i < scarf.length; i++) {
      const a = scarf[i - 1], b = scarf[i];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, k = (d - seg) / d;
      if (i === 1) { b.x -= dx * k; b.y -= dy * k; }
      else { a.x += dx * k * 0.5; a.y += dy * k * 0.5; b.x -= dx * k * 0.5; b.y -= dy * k * 0.5; }
    }
    scarf[0].x = ax; scarf[0].y = ay;
  }
}

function start() {
  state = 'play'; stateT = 0;
  initAudio(); SFX.start();
  if (AC) { nextNote = AC.currentTime + 0.05; step = 0; }
  popup(P.x + 40, P.y - 120, 'GO!', '#ffffff', 40);
  puff(P.x - 10, P.y, 14, { a: Math.PI * 1.1, spread: 0.5, v: 400 });
  shake = 4;
}
function gameOver() {
  state = 'over'; stateT = 0;
  const m = Math.floor(P.x / U_PER_M);
  P.newBest = m > best;
  if (m > best) { best = m; saveBest(); }
  SFX.over(); shake = 8;
}

// ---------------------------------------------------------------- 更新
let spdN = 0;
// 横長なら高さ640基準、縦長スマホでも小さくなりすぎないよう幅は最低680
function viewScale() {
  let sc = H / (640 * cam.zoom);
  const minW = (W > H ? 1100 : 680) * cam.zoom;
  if (W / sc < minW) sc = W / minW;
  return sc;
}
function update(rdt) {
  let dt = rdt;
  if (hitStop > 0) { hitStop -= rdt; dt *= 0.12; }
  time += dt; stateT += rdt;
  if (state === 'play') updatePlay(dt);
  spdN = state === 'play' ? clamp((P.vx - 500) / 900, 0, 1.4) : damp(spdN, 0, 3, dt);

  // カメラ
  cam.zoom = damp(cam.zoom, 1 + spdN * 0.3, 2.5, dt);
  if (state !== 'over') {
    const vs = viewScale(), viewW = W / vs, viewH = H / vs;
    cam.off = damp(cam.off, viewW * (0.22 + 0.06 * Math.min(spdN, 1)), 3, dt);
    cam.x = P.x + cam.off;
    cam.y = damp(cam.y, P.y - (W > H ? Math.min(viewH * 0.12, 80 * cam.zoom) : viewH * 0.2), P.ground ? 4 : 2.2, dt);
  }
  shake = damp(shake, 0, 9, rdt);
  flash = Math.max(0, flash - rdt * 1.6);

  // スカーフ
  const ps = poseState();
  const pose = computePose(ps); P.pose = pose;
  updateScarf(dt, pose);

  // パーティクル
  for (const p of parts) {
    p.life += dt; p.vy += p.g * dt;
    const dr = Math.exp(-p.drag * dt); p.vx *= dr; p.vy *= dr;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  parts = parts.filter(p => p.life < p.max);
  if (parts.length > 600) parts.splice(0, parts.length - 600);
  for (const p of popups) { p.life += rdt; p.y -= 50 * rdt; if (state === 'play') p.x += P.vx * rdt * 0.85; }
  popups = popups.filter(p => p.life < 1.1);
  for (const t of trail) t.life += dt;
  trail = trail.filter(t => t.life < 0.22);

  // 集中線(画面座標)
  if (state === 'play') {
    const rate = Math.max(0, P.vx - 760) / 10 + (boostT > 0 ? 40 : 0);
    let n = rate * rdt; while (n > 0) { if (Math.random() < n) lines.push({ x: W + rand(0, 100), y: rand(0, H), len: rand(80, 260), v: rand(1800, 3400) * (P.vx / 1100), a: rand(0.15, 0.45) }); n -= 1; }
  }
  for (const l of lines) l.x -= l.v * rdt;
  lines = lines.filter(l => l.x + l.len > -10);

  updateAudio(spdN);
}

// ---------------------------------------------------------------- 描画
const SKY = [ // [位置, 上, 下, 太陽色]
  [0.00, '#4aa3ff', '#ffe2b8'],
  [0.28, '#5b6fd6', '#ffb37b'],
  [0.38, '#3a2c6b', '#ff7a6b'],
  [0.52, '#0b0f2e', '#2b2257'],
  [0.78, '#141a45', '#3d2f6e'],
  [0.88, '#7a6fd0', '#ffb3a0'],
  [1.00, '#4aa3ff', '#ffe2b8'],
];
function skyAt(t) {
  for (let i = 0; i < SKY.length - 1; i++) {
    const a = SKY[i], b = SKY[i + 1];
    if (t >= a[0] && t <= b[0]) { const k = (t - a[0]) / (b[0] - a[0]); return [mix(hex(a[1]), hex(b[1]), k), mix(hex(a[2]), hex(b[2]), k)]; }
  }
  return [hex(SKY[0][1]), hex(SKY[0][2])];
}
const orbSprite = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.22, 'rgba(160,250,255,1)');
  gr.addColorStop(0.45, 'rgba(80,220,255,0.45)'); gr.addColorStop(1, 'rgba(80,220,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return c;
})();

function render() {
  const sc = viewScale();
  const sx = (Math.random() - 0.5) * shake * 2, sy = (Math.random() - 0.5) * shake * 2;
  const left = cam.x - W / 2 / sc, right = cam.x + W / 2 / sc, bottom = cam.y + H / 2 / sc;

  // 空
  const dayT = ((P.x / U_PER_M) / 2400 + 0.02) % 1;
  const [skyTop, skyBot] = skyAt(dayT);
  const night = clamp(1 - Math.abs(dayT - 0.65) / 0.17, 0, 1);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sg = ctx.createLinearGradient(0, 0, 0, H);
  sg.addColorStop(0, rgb(skyTop)); sg.addColorStop(1, rgb(skyBot));
  ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);
  // 星
  if (night > 0) {
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 90; i++) {
      const x = ((hash(i) * W * 1.5 - P.x * 0.005 * sc) % W + W) % W, y = hash(i + 99) * H * 0.6;
      ctx.globalAlpha = night * (0.4 + 0.6 * Math.abs(Math.sin(time * 1.5 + i)));
      ctx.fillRect(x, y, 1.6, 1.6);
    }
    ctx.globalAlpha = 1;
  }
  // 太陽 / 月
  const sunArc = dayT < 0.45 ? dayT / 0.45 : (dayT > 0.85 ? (dayT - 0.85) / 0.6 : -1);
  if (sunArc >= 0) {
    const sxp = W * (0.85 - sunArc * 0.4), syp = H * (0.12 + Math.pow(sunArc, 2) * 0.4);
    const gr = ctx.createRadialGradient(sxp, syp, 0, sxp, syp, H * 0.35);
    gr.addColorStop(0, 'rgba(255,240,200,0.9)'); gr.addColorStop(0.08, 'rgba(255,220,160,0.6)'); gr.addColorStop(1, 'rgba(255,200,150,0)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff6e0'; ctx.beginPath(); ctx.arc(sxp, syp, H * 0.045, 0, Math.PI * 2); ctx.fill();
  }
  if (night > 0) {
    ctx.globalAlpha = night; ctx.fillStyle = '#f4f1ff';
    ctx.beginPath(); ctx.arc(W * 0.72, H * 0.18, H * 0.04, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgb(skyTop); ctx.beginPath(); ctx.arc(W * 0.72 + H * 0.016, H * 0.18 - H * 0.01, H * 0.036, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // 遠景レイヤー
  const dark = hex('#141127');
  const layer = (f, B, amp, freq, k, seed) => {
    ctx.fillStyle = rgb(mix(skyBot, mix(skyTop, dark, 0.5), k));
    ctx.beginPath(); ctx.moveTo(0, H);
    const by = H / 2 + (B - cam.y * f * 0.6) * sc;
    for (let x = 0; x <= W + 8; x += 8) {
      const u = (x - W / 2) / sc + cam.x * f;
      const h = Math.sin(u * freq + seed) * 0.5 + Math.sin(u * freq * 2.3 + seed * 2) * 0.3 + Math.sin(u * freq * 5.1 + seed * 3) * 0.15;
      ctx.lineTo(x, by - (h + 1) * amp * sc);
    }
    ctx.lineTo(W, H); ctx.fill();
  };
  layer(0.04, 76, 110, 0.0016, 0.25, 1);
  layer(0.12, 117, 70, 0.003, 0.45, 4);
  // 街並み
  {
    const f = 0.3, col = mix(skyBot, mix(skyTop, dark, 0.7), 0.7);
    const by = H / 2 + (165 - cam.y * f * 0.6) * sc;
    const u0 = (0 - W / 2) / sc + cam.x * f, u1 = (W - W / 2) / sc + cam.x * f;
    const bw = 70;
    ctx.fillStyle = rgb(col);
    for (let i = Math.floor(u0 / bw) - 1; i <= Math.ceil(u1 / bw); i++) {
      const hgt = 40 + hash(i) * 150, wd = bw * (0.6 + hash(i + 7) * 0.5);
      const x = (i * bw - cam.x * f) * sc + W / 2;
      ctx.fillRect(x, by - hgt * sc, wd * sc, H - by + hgt * sc);
    }
    if (night > 0.2) {
      ctx.fillStyle = `rgba(255,220,140,${(night - 0.2) * 0.8})`;
      for (let i = Math.floor(u0 / bw) - 1; i <= Math.ceil(u1 / bw); i++) {
        const hgt = 40 + hash(i) * 150, wd = bw * (0.6 + hash(i + 7) * 0.5);
        const x = (i * bw - cam.x * f) * sc + W / 2;
        for (let wy = 12; wy < hgt - 6; wy += 16) for (let wx = 8; wx < wd - 8; wx += 14)
          if (hash(i * 31 + wy * 7 + wx) > 0.55) ctx.fillRect(x + wx * sc, by - (hgt - wy) * sc, 5 * sc, 6 * sc);
      }
    }
  }

  // ---- ワールド座標
  ctx.setTransform(DPR * sc, 0, 0, DPR * sc, DPR * (W / 2 - cam.x * sc + sx), DPR * (H / 2 - cam.y * sc + sy));
  const gBody = rgb(mix(dark, skyTop, 0.12)), gStripe = rgb(mix(dark, skyTop, 0.2)), gTop = rgb(mix(hex('#ffe9cf'), skyBot, 0.3 + night * 0.3));
  const gEdge = rgb(mix(hex('#ff9f68'), skyBot, 0.4));
  for (const p of plats) {
    if (p.x1 < left - 20 || p.x0 > right + 20) continue;
    const x0 = Math.max(p.x0, left - 20), x1 = Math.min(p.x1, right + 20);
    const hgt = bottom - p.y + 60;
    ctx.fillStyle = gBody; ctx.fillRect(x0, p.y, x1 - x0, hgt);
    ctx.fillStyle = gStripe;
    for (let x = Math.floor(x0 / 120) * 120; x < x1; x += 120) {
      const a = Math.max(x, x0), b = Math.min(x + 50, x1);
      if (b > a) ctx.fillRect(a, p.y + 18, b - a, hgt);
    }
    ctx.fillStyle = gEdge; ctx.fillRect(x0, p.y, x1 - x0, 10);
    ctx.fillStyle = gTop; ctx.fillRect(x0, p.y, x1 - x0, 4);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    for (let x = Math.floor(x0 / 80) * 80; x < x1 - 30; x += 80) if (x >= p.x0) ctx.fillRect(x, p.y + 13, 30, 3);
    if (p.x0 > left - 20) { ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(p.x0, p.y + 10, 6, hgt); }
  }
  // ブーストパッド
  for (const pd of pads) {
    if (pd.x > right || pd.x + pd.w < left) continue;
    ctx.fillStyle = pd.used ? 'rgba(125,249,255,0.25)' : 'rgba(125,249,255,0.35)';
    ctx.fillRect(pd.x, pd.y - 3, pd.w, 6);
    ctx.strokeStyle = pd.used ? 'rgba(125,249,255,0.4)' : '#7df9ff'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      const ph = ((time * 3 + i / 3) % 1);
      const x = pd.x + 20 + i * 38;
      ctx.globalAlpha = pd.used ? 0.4 : 0.5 + 0.5 * Math.sin(ph * Math.PI * 2);
      ctx.beginPath(); ctx.moveTo(x, pd.y - 22); ctx.lineTo(x + 14, pd.y - 11); ctx.lineTo(x, pd.y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  // 障害物
  for (const o of obs) {
    if (o.x > right + 100 || o.x + o.w < left - 100) continue;
    ctx.save();
    const cx = o.x + o.w / 2 + o.dx, cy = (o.top + o.bot) / 2 + o.dy;
    if (o.type === 'b' && !o.hit) {
      ctx.strokeStyle = 'rgba(30,30,40,0.8)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(o.x + 14, o.top); ctx.lineTo(o.x + 14, o.top - 800); ctx.moveTo(o.x + o.w - 14, o.top); ctx.lineTo(o.x + o.w - 14, o.top - 800); ctx.stroke();
    }
    ctx.translate(cx, cy); ctx.rotate(o.rot);
    const w = o.w, h = o.bot - o.top;
    if (o.type === 'h') {
      ctx.fillStyle = '#ff8a3d'; ctx.fillRect(-w / 2, -h / 2, w, h);
      ctx.strokeStyle = '#b4501a'; ctx.lineWidth = 3;
      ctx.strokeRect(-w / 2 + 1.5, -h / 2 + 1.5, w - 3, h - 3);
      ctx.beginPath(); ctx.moveTo(-w / 2, -h / 2); ctx.lineTo(w / 2, h / 2); ctx.moveTo(w / 2, -h / 2); ctx.lineTo(-w / 2, h / 2); ctx.stroke();
    } else {
      ctx.fillStyle = '#ffd23f'; ctx.fillRect(-w / 2, -h / 2, w, h);
      ctx.save(); ctx.beginPath(); ctx.rect(-w / 2, h / 2 - 34, w, 34); ctx.clip();
      ctx.fillStyle = '#1b1d2b';
      for (let i = -3; i < 8; i++) { ctx.beginPath(); ctx.moveTo(-w / 2 + i * 22, h / 2); ctx.lineTo(-w / 2 + i * 22 + 11, h / 2); ctx.lineTo(-w / 2 + i * 22 + 45, h / 2 - 34); ctx.lineTo(-w / 2 + i * 22 + 34, h / 2 - 34); ctx.fill(); }
      ctx.restore();
      ctx.fillStyle = '#1b1d2b';
      ctx.beginPath(); ctx.moveTo(-16, -40); ctx.lineTo(16, -40); ctx.lineTo(16, -6); ctx.lineTo(30, -6); ctx.lineTo(0, 24); ctx.lineTo(-30, -6); ctx.lineTo(-16, -6); ctx.fill();
      ctx.strokeStyle = '#1b1d2b'; ctx.lineWidth = 4; ctx.strokeRect(-w / 2 + 2, -h / 2 + 2, w - 4, h - 4);
    }
    ctx.restore();
  }
  // オーブ
  ctx.globalCompositeOperation = 'lighter';
  for (const o of orbs) {
    if (o.x < left - 50 || o.x > right + 50) continue;
    const r = 30 + Math.sin(time * 6 + o.x * 0.01) * 3;
    ctx.drawImage(orbSprite, o.x - r, o.y - r, r * 2, r * 2);
  }
  ctx.globalCompositeOperation = 'source-over';

  // 残像
  for (const t of trail) drawRunner(t, '#6ee7ff', '#3aa6c9', (1 - t.life / 0.22) * 0.35);

  // スカーフ
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i = 1; i < scarf.length; i++) {
    ctx.strokeStyle = i % 2 ? '#ff3d6e' : '#ff5c84';
    ctx.lineWidth = lerp(7, 3, i / scarf.length);
    ctx.beginPath(); ctx.moveTo(scarf[i - 1].x, scarf[i - 1].y); ctx.lineTo(scarf[i].x, scarf[i].y); ctx.stroke();
  }
  // プレイヤー
  if (!(P.inv > 0 && Math.floor(time * 20) % 2 === 0)) {
    if (night > 0.3) { ctx.shadowColor = 'rgba(180,200,255,0.8)'; ctx.shadowBlur = 12 * sc; }
    drawRunner(poseState(), '#1c1e2e', '#3a3d55');
    ctx.shadowBlur = 0;
  }
  // パーティクル
  for (const p of parts) {
    const k = 1 - p.life / p.max;
    if (p.col === 'spark' || p.col === 'ring') {
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = p.col === 'ring' ? `rgba(255,255,255,${k})` : `rgba(140,240,255,${k})`;
    } else if (p.col === 'wood') ctx.fillStyle = `rgba(255,138,61,${k})`;
    else if (p.col === 'sign') ctx.fillStyle = `rgba(255,210,63,${k})`;
    else ctx.fillStyle = rgb(mix(gTopRGB(skyBot, night), [255, 255, 255], 0.2), k * 0.7);
    const s = p.size * (p.col === 'dust' ? (1 + (1 - k) * 1.5) : k + 0.3);
    ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
    ctx.globalCompositeOperation = 'source-over';
  }
  // ポップアップ
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of popups) {
    const k = p.life / 1.1, s = p.size * (k < 0.12 ? 0.6 + k / 0.12 * 0.6 : 1.2 - Math.min(0.2, (k - 0.12)));
    ctx.globalAlpha = 1 - Math.pow(k, 3);
    ctx.font = `900 ${s}px ${FONT}`;
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(20,18,40,0.75)'; ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.col; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;

  // ---- 画面座標:集中線・ビネット・HUD
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.strokeStyle = '#fff'; ctx.lineCap = 'round';
  for (const l of lines) { ctx.globalAlpha = l.a; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x + l.len, l.y); ctx.stroke(); }
  ctx.globalAlpha = 1;
  if (spdN > 0.2) {
    const vg = ctx.createRadialGradient(W * 0.4, H / 2, Math.min(W, H) * 0.35, W * 0.4, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(10,8,30,0)'); vg.addColorStop(1, `rgba(10,8,30,${clamp((spdN - 0.2) * 0.4, 0, 0.45)})`);
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
  if (flash > 0) { ctx.globalAlpha = flash * 0.5; ctx.fillStyle = flashCol; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }

  drawHUD();
}
function gTopRGB(skyBot, night) { return mix(hex('#ffe9cf'), skyBot, 0.3 + night * 0.3); }

function text(t, x, y, size, col = '#fff', weight = 800, align = 'center', stroke = true) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = Math.max(3, size * 0.16); ctx.strokeStyle = 'rgba(15,12,35,0.7)'; ctx.lineJoin = 'round'; ctx.strokeText(t, x, y); }
  ctx.fillStyle = col; ctx.fillText(t, x, y);
}
const muteBtn = () => ({ x: W - 56, y: 14, w: 42, h: 42 });
function drawHUD() {
  const u = clamp(Math.min(W, H) / 420, 0.8, 1.6);
  // ミュートボタン
  const mb = muteBtn();
  ctx.fillStyle = 'rgba(15,12,35,0.35)'; ctx.beginPath(); ctx.arc(mb.x + 21, mb.y + 21, 20, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath();
  ctx.moveTo(mb.x + 11, mb.y + 17); ctx.lineTo(mb.x + 17, mb.y + 17); ctx.lineTo(mb.x + 24, mb.y + 11); ctx.lineTo(mb.x + 24, mb.y + 31); ctx.lineTo(mb.x + 17, mb.y + 25); ctx.lineTo(mb.x + 11, mb.y + 25); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.2;
  if (muted) { ctx.beginPath(); ctx.moveTo(mb.x + 28, mb.y + 16); ctx.lineTo(mb.x + 34, mb.y + 26); ctx.moveTo(mb.x + 34, mb.y + 16); ctx.lineTo(mb.x + 28, mb.y + 26); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(mb.x + 24, mb.y + 21, 6, -0.9, 0.9); ctx.stroke(); ctx.beginPath(); ctx.arc(mb.x + 24, mb.y + 21, 11, -0.9, 0.9); ctx.stroke(); }

  if (state === 'title') {
    const cy = H * 0.3;
    const bob = Math.sin(time * 2) * 4;
    text('かぜはしり', W / 2, cy + bob, 64 * u, '#ffffff', 900);
    text('風になれ。', W / 2, cy + 50 * u, 20 * u, '#ffe9cf', 700);
    const a = 0.55 + 0.45 * Math.sin(time * 4);
    ctx.globalAlpha = a;
    text(isTouch ? 'タップでスタート' : 'スペースキー / クリックでスタート', W / 2, H * 0.78, 22 * u, '#fff', 800);
    ctx.globalAlpha = 1;
    text(isTouch ? '右側タップ:ジャンプ(空中でもう1回)  左側おしっぱなし:スライド / 急降下'
                 : 'スペース・↑:ジャンプ(空中でもう1回)   ↓:スライド / 急降下   M:音', W / 2, H * 0.78 + 34 * u, 13 * u, 'rgba(255,255,255,0.85)', 600);
    if (best > 0) text('ベスト ' + best + ' m', W / 2, H * 0.78 + 62 * u, 15 * u, '#ffd23f', 800);
    return;
  }
  // 距離
  const m = Math.floor(P.x / U_PER_M);
  text(m + ' m', 20, 34 * u, 34 * u, '#fff', 900, 'left');
  if (best > 0) text('ベスト ' + best + ' m', 22, 66 * u, 13 * u, 'rgba(255,255,255,0.8)', 700, 'left');
  // スピードメーター
  const kmh = Math.round(P.vx * KMH);
  const bx = 20, by = H - 30 * u, bw = Math.min(260 * u, W * 0.45), bh = 10 * u;
  ctx.fillStyle = 'rgba(15,12,35,0.45)'; ctx.fillRect(bx, by, bw, bh);
  const f = clamp(kmh / 210, 0, 1);
  const gr = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  gr.addColorStop(0, '#7df9ff'); gr.addColorStop(0.6, '#ffd23f'); gr.addColorStop(1, '#ff3d6e');
  ctx.fillStyle = gr; ctx.fillRect(bx, by, bw * f, bh);
  text(kmh + '', bx, by - 22 * u, 30 * u, boostT > 0 ? '#7df9ff' : '#fff', 900, 'left');
  ctx.font = `900 ${30 * u}px ${FONT}`;
  text('km/h', bx + ctx.measureText(kmh + '').width + 6, by - 18 * u, 13 * u, 'rgba(255,255,255,0.85)', 700, 'left');
  // コンボ
  if (combo >= 2) {
    const k = clamp(comboT / 2.2, 0, 1);
    ctx.globalAlpha = 0.4 + 0.6 * k;
    ctx.font = `800 ${14 * u}px ${FONT}`;
    const cw = ctx.measureText('コンボ').width;
    text(combo + '', W - 26 - cw, 92 * u, 38 * u, '#7df9ff', 900, 'right');
    text('コンボ', W - 20, 96 * u, 14 * u, '#fff', 800, 'right');
    ctx.globalAlpha = 1;
  }
  // 操作ヒント
  if (state === 'play' && stateT < 7) {
    ctx.globalAlpha = clamp(7 - stateT, 0, 1) * 0.9;
    text(isTouch ? '右:ジャンプ(2段OK)  左おしっぱなし:スライド' : 'スペース:ジャンプ(2段OK)  ↓:スライド・急降下', W / 2, H - 118 * u, 14 * u, '#fff', 700);
    if (stateT > 2.5) text('空中で↓ → 着地でダイブ加速!', W / 2, H - 96 * u, 13 * u, '#ffd23f', 700);
    ctx.globalAlpha = 1;
  }
  if (state === 'over') {
    const k = clamp(stateT / 0.4, 0, 1);
    ctx.fillStyle = `rgba(12,10,30,${0.55 * k})`; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = k;
    const cy = H * 0.34;
    text('おちた!', W / 2, cy, 46 * u, '#fff', 900);
    text(m + ' m', W / 2, cy + 64 * u, 56 * u, '#ffd23f', 900);
    if (P.newBest) text('ベスト更新!', W / 2, cy + 108 * u, 20 * u, '#ff5c84', 900);
    text(`最高速 ${Math.round(maxSpd * KMH)} km/h   最大コンボ ${maxCombo}`, W / 2, cy + 140 * u, 16 * u, '#fff', 700);
    if (stateT > 0.8) {
      ctx.globalAlpha = 0.55 + 0.45 * Math.sin(time * 4);
      text(isTouch ? 'タップでもう一回' : 'スペース / クリックでもう一回', W / 2, H * 0.78, 22 * u, '#fff', 800);
    }
    ctx.globalAlpha = 1;
  }
}

// ---------------------------------------------------------------- 入力処理
function pressJump() {
  initAudio();
  if (state === 'title') { start(); }
  else if (state === 'over') { if (stateT > 0.8) { reset(); start(); } }
  else input.jumpPressed = true;
}
const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW', 'KeyZ', 'Enter'];
const DOWN_KEYS = ['ArrowDown', 'KeyS', 'KeyX'];
addEventListener('keydown', e => {
  if (JUMP_KEYS.includes(e.code) || DOWN_KEYS.includes(e.code)) e.preventDefault();
  if (JUMP_KEYS.includes(e.code)) { if (!e.repeat) pressJump(); input.jumpKey = true; }
  else if (DOWN_KEYS.includes(e.code)) { input.downKey = true; initAudio(); }
  else if (e.code === 'KeyM') toggleMute();
});
addEventListener('keyup', e => {
  if (JUMP_KEYS.includes(e.code)) input.jumpKey = false;
  else if (DOWN_KEYS.includes(e.code)) input.downKey = false;
});
addEventListener('blur', () => { input.jumpKey = input.downKey = false; input.jumpTouch = input.downTouch = 0; ptrs.clear(); });
function toggleMute() {
  muted = !muted; initAudio();
  try { localStorage.setItem('kazehashiri_mute', muted ? '1' : '0'); } catch (e) {}
}
const ptrs = new Map();
cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (e.pointerType === 'touch') isTouch = true; else if (e.pointerType === 'mouse') isTouch = false;
  const mb = muteBtn();
  if (e.clientX > mb.x - 8 && e.clientY < mb.y + mb.h + 8) { toggleMute(); return; }
  if (state !== 'play') { pressJump(); return; }
  const role = (e.pointerType !== 'mouse' && e.clientX < W * 0.4) ? 'down' : 'jump';
  ptrs.set(e.pointerId, role);
  if (role === 'down') input.downTouch++;
  else { input.jumpTouch++; pressJump(); }
  try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
});
const endPtr = e => {
  const role = ptrs.get(e.pointerId); if (!role) return;
  ptrs.delete(e.pointerId);
  if (role === 'down') input.downTouch = Math.max(0, input.downTouch - 1);
  else input.jumpTouch = Math.max(0, input.jumpTouch - 1);
};
cvs.addEventListener('pointerup', endPtr);
cvs.addEventListener('pointercancel', endPtr);
cvs.addEventListener('contextmenu', e => e.preventDefault());

// ---------------------------------------------------------------- ループ
reset();
let last = performance.now();
function frame(now) {
  const rdt = Math.min(1 / 30, (now - last) / 1000); last = now;
  update(rdt); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__dbg = () => ({ plats, obs });
window.__game = { get P() { return P; }, get state() { return state; }, input, pressJump };
</script>
