const WORDS = RAW.map(([en, ja, pos, cat, ex, exJa]) => ({ en, ja, pos, cat, ex, exJa }));

// ---------- 定数 ----------
const MAXV = 40;       // m/s 上限
const GOAL = 1000;        // m
const N_CARDS = 18;       // 走行中に流れる単語数
const N_Q = 8;            // テスト問題数
const FONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",sans-serif';
const IS_TOUCH = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || 'ontouchstart' in window;

// ---------- util ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const hs = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const toA = c => typeof c === 'string' ? [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)] : c;
const mixA = (c1, c2, t) => { const a = toA(c1), b = toA(c2); return [lerp(a[0],b[0],t), lerp(a[1],b[1],t), lerp(a[2],b[2],t)]; };
const css = (a, k = 1, al = 1) => `rgba(${a[0]*k|0},${a[1]*k|0},${a[2]*k|0},${al})`;
const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;

// ---------- canvas ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
}
addEventListener('resize', resize); resize();

function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function txt(s, x, y, size, color, o = {}) {
  const { align = 'center', weight = '800', maxW = 0, stroke = null, sw = 0, alpha = 1 } = o;
  ctx.font = `${weight} ${size}px ${FONT}`;
  if (maxW) { const w = ctx.measureText(s).width; if (w > maxW) { size *= maxW / w; ctx.font = `${weight} ${size}px ${FONT}`; } }
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.globalAlpha = alpha;
  if (stroke) { ctx.lineWidth = sw || size * 0.16; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y); ctx.globalAlpha = 1;
}

// ---------- audio (効果音 + 音声読み上げ) ----------
let AC = null, muted = false;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type = 'square', v = .07, slide = 0, delay = 0) {
  if (muted) return; const a = ac(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .02);
}
function noise(d, v = .12, delay = 0) {
  if (muted) return; const a = ac(); if (!a) return;
  const n = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, n, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), g = a.createGain(), t = a.currentTime + delay;
  s.buffer = buf; g.gain.value = v; s.connect(g); g.connect(a.destination); s.start(t);
}
const sfx = {
  get()   { tone(660, .08, 'square', .06); tone(990, .12, 'square', .06, 0, .07); },
  pop()   { tone(420, .05, 'triangle', .04, 200); },
  step()  { tone(80, .05, 'triangle', .05, -30); },
  level() { tone(520, .1, 'square', .06); tone(780, .1, 'square', .06, 0, .09); tone(1040, .16, 'square', .06, 0, .18); },
  punch() { noise(.08, .18); tone(140, .12, 'sawtooth', .09, -80); },
  jump(h) { tone(300 + h * 500, .06, 'sine', .035); },
  charge(p){ tone(120 + p * 400, .07, 'sawtooth', .04); },
  slam()  { noise(.35, .3); tone(90, .35, 'sawtooth', .15, -60); },
  ok()    { [523, 659, 784, 1047].forEach((f, i) => tone(f, .16, 'square', .07, 0, i * .08)); },
  ng()    { tone(220, .3, 'sawtooth', .09, -120); tone(160, .4, 'sawtooth', .09, -90, .12); },
};
let voice = null;
function pickVoice() {
  try { const vs = speechSynthesis.getVoices(); voice = vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null; } catch (e) {}
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, rate = .9) {
  if (muted || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = rate; if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ---------- particles / pops / shake ----------
const parts = [], pops = [];
let shake = 0;
function burst(x, y, n, col, spd = 300, size = 5, life = .7) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = spd * (.3 + Math.random());
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - spd * .2, life: life * (.6 + Math.random() * .6), max: life, col, size: size * (.5 + Math.random()), g: 700 });
  }
}
function pop(x, y, text, col, size, life = 1) { pops.push({ x, y, text, col, size, life, max: life }); }
function updFx(dt) {
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; if (p.life <= 0) parts.splice(i, 1); }
  for (let i = pops.length - 1; i >= 0; i--) { const p = pops[i]; p.y -= 40 * dt; p.life -= dt; if (p.life <= 0) pops.splice(i, 1); }
  shake = Math.max(0, shake - dt * 3);
}
function drawFx() {
  for (const p of parts) { ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.col; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  ctx.globalAlpha = 1;
  for (const p of pops) {
    const k = p.life / p.max, sc = 1 + (1 - k) * .2;
    txt(p.text, p.x, p.y, p.size * sc, p.col, { stroke: '#000', alpha: clamp(k * 2, 0, 1) });
  }
}

// ---------- ヒーロー (棒人間ではなく太めの力強いキャラ) ----------
function seg(x, y, a, l) { return [x + Math.sin(a) * l, y + Math.cos(a) * l]; }
function limb(x0, y0, a1, a2, l1, l2, w, col, pants, foot) {
  const [x1, y1] = seg(x0, y0, a1, l1), [x2, y2] = seg(x1, y1, a2, l2);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = col; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  if (pants) { const [px, py] = seg(x0, y0, a1, l1 * .8); ctx.strokeStyle = pants; ctx.lineWidth = w * 1.25; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(px, py); ctx.stroke(); }
  if (foot) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(x2 + 3, y2, w * .8, w * .55, 0, 0, 7); ctx.fill(); }
}
// o: {pose:'run'|'idle'|'jump'|'dive', lean 0..1, ph, t, aura 0..1}
function drawHero(x, y, s, o) {
  const t = o.t || 0;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (o.aura > 0) {
    const f = .75 + Math.random() * .25, g = ctx.createRadialGradient(0, -55, 5, 0, -55, 95);
    g.addColorStop(0, `rgba(255,220,80,${.75 * o.aura * f})`); g.addColorStop(.5, `rgba(255,90,20,${.45 * o.aura * f})`); g.addColorStop(1, 'rgba(255,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, -55, 95, 0, 7); ctx.fill();
  }
  let bob = 0, tilt = 0, la1, la2, lb1, lb2, aa1, aa2, ab1, ab2;
  const pose = o.pose;
  if (pose === 'run') {
    const ph = o.ph, L = o.lean; tilt = .1 + L * .62; const amp = .75 + L * .45;
    la1 = Math.sin(ph) * amp + .1 * L; lb1 = Math.sin(ph + Math.PI) * amp + .1 * L;
    la2 = la1 - (.25 + (1 + Math.sin(ph + 1.2)) * .62); lb2 = lb1 - (.25 + (1 + Math.sin(ph + 1.2 + Math.PI)) * .62);
    aa1 = -Math.sin(ph) * 1.0; ab1 = Math.sin(ph) * 1.0; aa2 = aa1 + 1.4; ab2 = ab1 + 1.4;
    bob = -Math.abs(Math.sin(ph)) * 4;
  } else if (pose === 'idle') {
    tilt = .05; bob = Math.sin(t * 3) * 1.3; la1 = la2 = .12; lb1 = lb2 = -.12; aa1 = .15; aa2 = .55; ab1 = -.1; ab2 = .4;
  } else if (pose === 'jump') {
    tilt = .12; la1 = 1.0; la2 = .05; lb1 = .25; lb2 = -.85; aa1 = 2.7; aa2 = 2.9; ab1 = 2.4; ab2 = 2.7;
  } else { // dive: 頭を下にして構える
    const wob = Math.sin(t * 45) * .04 * (o.aura || 0);
    ctx.translate(0, -55); ctx.rotate(Math.PI + wob); ctx.translate(0, 55);
    tilt = 0; la1 = la2 = -.1; lb1 = lb2 = .1; aa1 = aa2 = 3.1; ab1 = ab2 = 3.0;
  }
  const hx = 0, hy = -46 + bob, shx = hx + Math.sin(tilt) * 36, shy = hy - Math.cos(tilt) * 36;
  const SKIN = '#f2b98b', SKIN2 = '#c98e63', SHIRT = '#e8392f', SHORTS = '#223a8c';
  limb(shx, shy, ab1, ab2, 18, 17, 8, SKIN2);                 // 奥の腕
  limb(hx, hy, lb1, lb2, 24, 24, 10, SKIN2, '#16275f', true); // 奥の脚
  ctx.strokeStyle = SHIRT; ctx.lineWidth = 24; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(shx, shy); ctx.stroke(); // 胴
  ctx.strokeStyle = '#ffe14a'; ctx.lineWidth = 5; ctx.beginPath();
  ctx.moveTo(hx + Math.sin(tilt) * 10 - 9, hy - Math.cos(tilt) * 10); ctx.lineTo(shx - 9 + Math.sin(tilt) * -2, shy + 4); ctx.stroke(); // ストライプ
  limb(hx, hy, la1, la2, 24, 24, 11, SKIN, SHORTS, true);    // 手前の脚
  const hdx = shx + Math.sin(tilt) * 14, hdy = shy - Math.cos(tilt) * 14;
  ctx.fillStyle = SKIN; ctx.beginPath(); ctx.arc(hdx, hdy, 12.5, 0, 7); ctx.fill();
  ctx.fillStyle = '#2b1b12'; ctx.beginPath(); ctx.arc(hdx - 1, hdy - 3, 12.7, Math.PI * .95, Math.PI * 2.05); ctx.fill(); // 髪
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(hdx + 6, hdy + 1, 1.8, 0, 7); ctx.fill();               // 目
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(hdx - 12, hdy - 2); ctx.lineTo(hdx + 12, hdy - 3); ctx.stroke(); // 鉢巻
  ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(hdx - 12, hdy - 2);
  const sp = pose === 'run' ? 10 + o.lean * 16 : 8;
  ctx.quadraticCurveTo(hdx - 12 - sp * .6, hdy - 6 + Math.sin(t * 14) * 4, hdx - 12 - sp, hdy + Math.sin(t * 14 + 1) * 6); ctx.stroke();
  limb(shx, shy, aa1, aa2, 18, 17, 9, SKIN);                  // 手前の腕
  // こぶし
  { const [ex, ey] = seg(...seg(shx, shy, aa1, 18), aa2, 17); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, ey, 6.5, 0, 7); ctx.fill(); }
  ctx.restore();
}

// ---------- 入力 ----------
const held = {};
const ptrs = new Map(); // id -> {role, sx, sy, x, y, dn}
let kQueue = [];        // 押した瞬間のイベント
const MOVE = { ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0], ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1] };
addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  ac();
  if (e.repeat) return;
  held[e.code] = true; kQueue.push(e.code);
  if (e.code === 'KeyM') toggleMute();
});
addEventListener('keyup', e => { held[e.code] = false; });
addEventListener('blur', () => { for (const k in held) held[k] = false; ptrs.clear(); });

const keyFwd  = () => held.ArrowUp || held.KeyW || held.ArrowRight || held.KeyD || held.Space;
const keyJump = () => held.Space || held.KeyX || held.KeyJ;
const keyDown = () => held.ArrowDown || held.KeyS;
function ptrAny(role) { for (const p of ptrs.values()) if (p.role === role) return p; return null; }

function toggleMute() { muted = !muted; if (muted) { try { speechSynthesis.cancel(); } catch (e) {} } else sfx.pop(); }
const muteBtn = () => ({ x: W - 30, y: 30, r: 20 });

cv.addEventListener('pointerdown', e => {
  e.preventDefault(); ac();
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const x = e.clientX, y = e.clientY, p = { role: 'none', sx: x, sy: y, x, y, dn: false };
  ptrs.set(e.pointerId, p);
  const m = muteBtn();
  if (Math.hypot(x - m.x, y - m.y) < m.r * 1.6) { p.role = 'mute'; toggleMute(); return; }
  if (phase === 'run') p.role = 'fwd';
  else if (phase === 'title' || phase === 'result') { if (tPhase > .4) advanceScreen(); }
  else if (phase === 'test') testPointerDown(p, x, y);
});
cv.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  p.x = e.clientX; p.y = e.clientY;
  if (p.role === 'jump') { if (p.y - p.sy > H * .035) p.dn = true; }
});
function endPtr(e) {
  const p = ptrs.get(e.pointerId); if (!p) return;
  if (p.role === 'jump' && phase === 'test') {
    const L = layoutTest();
    if (Math.hypot(p.x - L.ans.x, p.y - L.ans.y) > L.br * 2.4) T.cancelReq = true; // ボタンから大きく外して離す=キャンセル
  }
  ptrs.delete(e.pointerId);
}
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('contextmenu', e => e.preventDefault());

// ---------- ゲーム状態 ----------
let phase = 'title', tPhase = 0, time = 0;

const runHeroX = () => W * (.24 + .1 * clamp(R.v / MAXV, 0, 1)) + (W < H ? W * .02 : 0);

  txt(Math.round(R.v * 3.6) + ' km/h', W / 2, H * .145, H * .032, '#ffe14a', { stroke: 'rgba(0,0,0,.5)' });

//  TEST フェーズ

}
const cellRect = (L, i) => ({ x: L.gx + (i % 3) * (L.cw + L.gap), y: L.gy0 + (i / 3 | 0) * (L.ch + L.gap), w: L.cw, h: L.ch });

    mode: 'play', slamT: 0, slamFrom: 0, power: 0, cancelReq: false, lockMsg: 0, t: 0 };

}

const ptrJump = () => ptrAny('jump');

function moveCell(dc, dr) {

}

  if (Math.hypot(x - L.ans.x, y - L.ans.y) < L.br * 1.25) { p.role = 'jump'; return; }
  if (y < H * .17) { say(T.q.w.en); return; }
  for (let i = 0; i < 6; i++) { const c = cellRect(L, i); if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) { T.cell = i; sfx.pop(); return; } }
}

function updateTest(dt) {
  const q = T.q, L = layoutTest(); T.t += dt;
  // キーイベント
  for (const k of kQueue) {
    if (T.mode === 'result') { if ((k === 'Enter' || k === 'Space') && q.resT > .5) nextQuestion(); continue; }
    if (T.mode !== 'play') continue;
    if (MOVE[k]) { const [dc, dr] = MOVE[k]; if (dr === 1 && isJump()) continue; moveCell(dc, dr); }
    else if (k === 'KeyZ' || k === 'KeyH') hintTap();
    else if (k === 'KeyR') say(q.w.en);
  }
  kQueue = [];
  // ヒーロー位置
  const c = cellRect(L, T.cell), tx = c.x + c.w / 2, ty = c.y + c.h * .9;
  T.hx = lerp(T.hx, tx, Math.min(1, dt * 14)); T.hy = lerp(T.hy, ty, Math.min(1, dt * 14));
  q.padHit = Math.max(0, q.padHit - dt * 6); q.lvFlash = Math.max(0, q.lvFlash - dt * 2);

  if (T.mode === 'play') {
    q.t += dt;
    const J = isJump(), Dn = isDown(), was = T.charging;
    // ヒントゲージ (パンチングマシーン): 放置で減っていく
    q.gauge = Math.max(0, q.gauge - dt * 16);
    // ジャンプ
    if (J) { const before = T.h; T.h = Math.min(1, T.h + (T.charging ? 0 : dt * .5 * (1 - .25 * T.h))); if (Math.floor(before * 10) !== Math.floor(T.h * 10)) sfx.jump(T.h); }
    else T.h = Math.max(0, T.h - dt * 2.4);
    q.maxH = Math.max(q.maxH, T.h);
    if (q.maxH >= .25 && !q.spoke) { q.spoke = true; say(q.w.ex, .85); }
    // 沈み込み (叩きつけチャージ)
    T.charging = J && Dn && T.h >= .5;
    if (J && Dn && T.h < .5) T.lockMsg = .6;
    T.lockMsg = Math.max(0, T.lockMsg - dt);
    if (T.charging) { const bp = T.p; T.p = Math.min(1, T.p + dt / 1.4); if (Math.floor(bp * 14) !== Math.floor(T.p * 14)) sfx.charge(T.p); shake = Math.max(shake, T.p * .3); if (Math.random() < .6) parts.push({ x: T.hx + (Math.random() - .5) * 40, y: T.hy - T.h * L.ch * 1.5, vx: (Math.random() - .5) * 120, vy: -200, life: .4, max: .4, col: Math.random() < .5 ? '#ff9d2e' : '#fff', size: 5, g: 0 }); }
    if (T.cancelReq) { T.cancelReq = false; if (was) { T.p = 0; T.charging = false; } }
    else if (was && !T.charging) {
      if (!Dn) { if (T.p >= .12) startSlam(); else T.p = 0; }   // ↓を離した=叩きつけ
      else if (!J) T.p = 0;                                       // ジャンプを先に離した=キャンセル
    }
    if (!T.charging && T.mode === 'play' && !J) T.p = Math.max(0, T.p - dt * 3);
  } else if (T.mode === 'slam') {
    T.slamT += dt / .2; T.h = T.slamFrom * (1 - T.slamT * T.slamT);
    if (T.slamT >= 1) { T.h = 0; impact(); }
  } else if (T.mode === 'result') {
    q.resT += dt; T.h = Math.max(0, T.h - dt * 3);
    if (q.resT > 3.2) nextQuestion();
  }
}
function startSlam() {
  T.mode = 'slam'; T.slamT = 0; T.slamFrom = T.h; T.power = T.p; T.charging = false; sfx.slam();
}
function impact() {
  const q = T.q, L = layoutTest(), c = cellRect(L, T.cell), cx = c.x + c.w / 2, cy = c.y + c.h * .6;
  q.pick = T.cell; const ok = q.pick === q.ans;
  let pts = 0;
  if (ok) {
    pts = Math.max(20, 100 + Math.round(T.power * 50) + Math.max(0, 30 - Math.round(q.t)) - q.hintLv * 15);
    T.score += pts; T.correct++; sfx.ok(); shake = .9 + T.power * .6;
    burst(cx, cy, 70, '#ffe14a', 520, 7, .9); burst(cx, cy, 30, '#3ddc84', 420, 6, .8);
    pop(cx, cy - c.h * .5, '+' + pts, '#ffe14a', H * .07, 1.4);
    if (T.power >= .7) pop(cx, cy - c.h * 1.1, 'SMASH!!', '#ff7a1f', H * .08, 1.3);
    say(q.w.en);
  } else {
    sfx.ng(); shake = 1; T.missed.push(q.w);
    burst(cx, cy, 50, '#ff5468', 420, 6, .8);
    pop(cx, cy - c.h * .5, 'MISS...', '#ff5468', H * .06, 1.2);
  }
  q.res = { ok, pts }; T.mode = 'result'; q.resT = 0;
}

function corrupt(s, amt, seed) {
  const G = '▓▒░#@%&§¿Жф҂Ω'; let o = '';
  for (let i = 0; i < s.length; i++) { const r = hs(i * 3.1 + seed); o += (r < amt && s[i] !== ' ') ? G[(hs(i * 7.7 + seed * 1.3) * G.length) | 0] : s[i]; }
  return o;
}
function infoLines() {
  const q = T.q, w = q.w, lines = [];
  if (q.res) {
    lines.push({ s: q.res.ok ? `◎ 正解!  +${q.res.pts}点` : `✕ 残念… 正解は「${w.ja}」`, c: q.res.ok ? '#7dffa8' : '#ff8a8a' });
    lines.push({ s: `${w.en} = ${w.ja}  (${w.pos})`, c: '#ffe14a' });
    lines.push({ s: w.ex, c: '#9fe3ff' });
    lines.push({ s: w.exJa.replace(/[「」]/g, ''), c: '#fff' });
    return lines;
  }
  // 1) ヒントボタン
  lines.push(q.hintLv >= 1 ? { s: `HINT Lv${q.hintLv}  品詞:${w.pos} / 頭文字:${w.en[0].toUpperCase()} / ${w.en.length}文字${q.hintLv >= 2 ? ' / 不正解を' + [0, 0, 2, 3, 4][q.hintLv] + '個消去' : ''}`, c: '#ffd36b' }
                         : { s: '左下ボタンを連打してパンチ! → ヒントが深くなる', c: '#7f86b8' });
  // 2) ジャンプ (高く・長く跳ぶほどひらめく)
  lines.push(q.maxH >= .25 ? { s: w.ex, c: '#9fe3ff' } : { s: '右下を長押しでジャンプ… 高く跳ぶとひらめく', c: '#7f86b8' });
  if (q.maxH >= .5) {
    const hid = q.maxH >= .75 ? `「${w.ja[0]}…」` : '「 ？ 」';
    lines.push({ s: w.exJa.replace(/「.*?」/, hid), c: '#fff' });
  } else lines.push({ s: q.maxH >= .25 ? 'もっと高く…(半分で回答解禁)' : '', c: '#7f86b8' });
  // 3) 沈み込みプレビュー (選んだマスの意味を入れた文)
  if (T.charging && T.p >= .25) {
    const opt = q.opts[T.cell], sentence = w.exJa.replace(/「.*?」/, `「${opt.ja}」`);
    if (T.cell === q.ans) {
      let s = '✓ ' + sentence; if (T.p >= .65) { const r = relWord(w); s += `  ※近い単語:${r.en}=${r.ja}`; }
      lines.push({ s, c: '#7dffa8', ok: true });
    } else {
      const seed = Math.floor(time * 10), amt = T.p >= .65 ? .6 : .32;
      lines.push({ s: '⚠ ' + corrupt(sentence, amt, seed) + (T.p >= .65 ? ' …崩壊!' : ''), c: '#ff5a5a', bad: true });
    }
  } else lines.push({ s: T.lockMsg > 0 ? 'もっと高く跳んでから! (ゲージ半分で解禁)' : (T.h >= .5 ? '↓(ボタンは下へドラッグ)で沈み込む → 離して叩きつけ!' : 'ジャンプ中に↓で沈むほど選んだマスの意味が見える'), c: T.lockMsg > 0 ? '#ff8a8a' : '#7f86b8' });
  return lines;
}

// ---------- メインループ ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; time += dt; tPhase += dt;
  // キー(画面遷移)
  if (phase === 'title' || phase === 'result') {
    for (const k of kQueue) if ((k === 'Enter' || k === 'Space') && tPhase > .4) { advanceScreen(); break; }
    kQueue = [];
  } else if (phase === 'run' || phase === 'gate') kQueue = [];

  if (phase === 'title') updateRun(dt);
  else if (phase === 'run' || phase === 'gate') updateRun(dt);
  else if (phase === 'test') updateTest(dt);
  updFx(dt);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake * 14, (Math.random() - .5) * shake * 14);
  if (phase === 'title') drawTitle();
  else if (phase === 'run' || phase === 'gate') { drawRun(); drawFx(); drawRunHUD(); }
  else if (phase === 'test') { drawTest(); drawFx(); }
  else if (phase === 'result') drawResult();
  ctx.restore();
  // ミュートボタン
  { const m = muteBtn(); ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 7); ctx.fill(); txt(muted ? '🔇' : '🔊', m.x, m.y + 1, m.r * 1.0, '#fff'); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// デバッグ/検証用フック
window.__game = { get phase() { return phase; }, get R() { return R; }, get T() { return T; }, startRun, startTest, held, setDist(d) { R.dist = d; } };
})();
</script>
