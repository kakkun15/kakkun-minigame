const WORDS = RAW.map(([en, ja, pos, cat, ex, exJa]) => ({ en, ja, pos, cat, ex, exJa }));

// ---------- 定数 ----------
const GOAL = 1000;     // m
const MAXV = 42;       // m/s 通常の上限 (BOOSTで一時的に超える)
const HERO_Z = 5;      // カメラからヒーローまでの距離(m)
const SEG = 3;         // 道路セグメント長(m)
const LANE = 3;        // レーン間隔(m)
const ZMAX = 160;
const N_Q = 8;         // テスト問題数
const QTIME = 12;      // 1問の制限時間(秒)
const FONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",sans-serif';
const IS_TOUCH = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || 'ontouchstart' in window;

// ---------- util ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const hs = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const toA = c => typeof c === 'string' ? [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)] : c;
const mixA = (c1, c2, t) => { const a = toA(c1), b = toA(c2); return [lerp(a[0],b[0],t), lerp(a[1],b[1],t), lerp(a[2],b[2],t)]; };
const css = (a, k = 1, al = 1) => { a = toA(a); return `rgba(${a[0]*k|0},${a[1]*k|0},${a[2]*k|0},${al})`; };
const fmtT = s => `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, '0')}`;

// ---------- canvas ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() { DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; }
addEventListener('resize', resize); resize();

function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function txt(s, x, y, size, color, o = {}) {
  const { align = 'center', weight = '800', maxW = 0, stroke = null, sw = 0, alpha = 1 } = o;
  if (size < 4) return;
  ctx.font = `${weight} ${size}px ${FONT}`;
  if (maxW) { const w = ctx.measureText(s).width; if (w > maxW) { size *= maxW / w; ctx.font = `${weight} ${size}px ${FONT}`; } }
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.globalAlpha = alpha;
  if (stroke) { ctx.lineWidth = sw || size * 0.16; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y); ctx.globalAlpha = 1;
}

// ---------- audio ----------
let AC = null, muted = false;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type = 'square', v = .07, slide = 0, delay = 0) {
  if (muted) return; const a = ac(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .02);
}
function noise(d, v = .12, delay = 0) {
  if (muted) return; const a = ac(); if (!a) return;
  const n = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, n, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), g = a.createGain(); s.buffer = buf; g.gain.value = v; s.connect(g); g.connect(a.destination); s.start(a.currentTime + delay);
}
const sfx = {
  get()   { tone(660, .08, 'square', .06); tone(990, .12, 'square', .06, 0, .07); },
  pop()   { tone(420, .05, 'triangle', .05, 200); },
  lane()  { tone(300, .05, 'triangle', .05, 300); },
  step()  { tone(80, .05, 'triangle', .045, -30); },
  level() { tone(520, .1, 'square', .06); tone(780, .1, 'square', .06, 0, .09); tone(1040, .16, 'square', .06, 0, .18); },
  quiz()  { tone(880, .08, 'square', .06); tone(880, .08, 'square', .06, 0, .12); },
  boost() { tone(300, .4, 'sawtooth', .08, 900); noise(.3, .12); [784, 988, 1175].forEach((f, i) => tone(f, .12, 'square', .05, 0, i * .06)); },
  crash() { noise(.45, .35); tone(120, .5, 'sawtooth', .14, -80); },
  bump()  { noise(.2, .25); tone(160, .2, 'square', .08, -90); },
  punch() { noise(.08, .18); tone(140, .12, 'sawtooth', .09, -80); },
  jump(h) { tone(300 + h * 500, .06, 'sine', .04); },
  charge(p){ tone(120 + p * 400, .07, 'sawtooth', .045); },
  slam()  { noise(.4, .35); tone(90, .4, 'sawtooth', .16, -60); },
  ok()    { [523, 659, 784, 1047].forEach((f, i) => tone(f, .16, 'square', .07, 0, i * .07)); },
  ng()    { tone(220, .3, 'sawtooth', .1, -120); tone(160, .4, 'sawtooth', .1, -90, .12); },
  tick()  { tone(1200, .04, 'square', .05); },
};
let voice = null;
function pickVoice() { try { const vs = speechSynthesis.getVoices(); voice = vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null; } catch (e) {} }
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, rate = .95) {
  if (muted || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = rate; if (voice) u.voice = voice; speechSynthesis.speak(u); } catch (e) {}
}

// ---------- FX ----------
const parts = [], pops = [];
let shake = 0, hitstop = 0, kick = 0, flash = 0, flashCol = '255,255,255';
function burst(x, y, n, col, spd = 300, size = 5, life = .7) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = spd * (.3 + Math.random());
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - spd * .2, life: life * (.6 + Math.random() * .6), max: life, col, size: size * (.5 + Math.random()), g: 700 });
  }
}
function shards(x, y, w, h, col, n = 18) {
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (Math.random() - .5) * 2.6, s = 300 + Math.random() * 600;
    parts.push({ k: 'shard', x: x + (Math.random() - .5) * w, y: y + (Math.random() - .5) * h, vx: Math.cos(a) * s, vy: Math.sin(a) * s, rot: Math.random() * 6, vr: (Math.random() - .5) * 20,
      w: w * (.08 + Math.random() * .14), h: h * (.1 + Math.random() * .2), life: 1.1, max: 1.1, col, g: 1600 });
  }
}
function ring(x, y, r0, col, life = .5, grow = 900) { parts.push({ k: 'ring', x, y, r: r0, grow, life, max: life, col, g: 0, vx: 0, vy: 0 }); }
function pop(x, y, text, col, size, life = 1) { pops.push({ x, y, text, col, size, life, max: life }); }
function updFx(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.k === 'shard') p.rot += p.vr * dt; if (p.k === 'ring') p.r += p.grow * dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (let i = pops.length - 1; i >= 0; i--) { const p = pops[i]; p.y -= 50 * dt; p.life -= dt; if (p.life <= 0) pops.splice(i, 1); }
}
function drawFx() {
  for (const p of parts) {
    const a = clamp(p.life / p.max, 0, 1); ctx.globalAlpha = a;
    if (p.k === 'shard') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.col; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.5; ctx.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); }
    else if (p.k === 'ring') { ctx.strokeStyle = p.col; ctx.lineWidth = 3 + a * 10; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.stroke(); }
    else { ctx.fillStyle = p.col; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  }
  ctx.globalAlpha = 1;
  for (const p of pops) { const k = p.life / p.max, sc = 1 + Math.max(0, k - .8) * 2.5; txt(p.text, p.x, p.y, p.size * sc, p.col, { stroke: '#000', alpha: clamp(k * 2.5, 0, 1) }); }
}

// ---------- ヒーロー(後ろ姿 / 走行用) ----------
function drawRunner(x, y, s, o) {
  const ph = o.ph, L = o.lean, t = o.t;
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.wob || 0); ctx.scale(s, s * (1 - L * .1));
  const sway = Math.sin(ph) * 2.5, bob = -Math.abs(Math.cos(ph)) * 4;
  const hipY = -46 + bob, torso = 40 * (1 - .28 * L), shY = hipY - torso;
  const SKIN = '#f2b98b', SKIN2 = '#d99a6c';
  const legs = [[-9, ph], [9, ph + Math.PI]].map(([lx, p]) => ({ lx, k: Math.sin(p) })).sort((a, b) => a.k - b.k);
  for (const g of legs) {
    const lift = Math.max(0, g.k) * 28, fwd = Math.max(0, -g.k);
    const kx = g.lx * 1.05, ky = hipY + 22 - fwd * 9 - lift * .15, fx = g.lx * 1.1, fy = -lift - fwd * 5;
    ctx.lineCap = 'round'; ctx.strokeStyle = g.k > 0 ? SKIN : SKIN2; ctx.lineWidth = 12;
    ctx.beginPath(); ctx.moveTo(g.lx * .8 + sway, hipY); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
    if (lift > 10) { ctx.fillStyle = '#ddd'; ctx.beginPath(); ctx.ellipse(fx, fy + 2, 9, 7 + lift * .08, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#ff5a1f'; ctx.fillRect(fx - 7, fy, 14, 3); }
    else { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(fx, fy + 2, 8, 5, 0, 0, 7); ctx.fill(); }
  }
  ctx.fillStyle = '#223a8c'; rr(-18 + sway, hipY - 8, 36, 18, 7); ctx.fill();
  for (const side of [-1, 1]) {
    const a = Math.sin(ph) * side, sx = side * 15 + sway, sy = shY + 6;
    const hx = side * 23 + sway, hy = shY + 30 - a * 16, ex = side * 26 + sway, ey = shY + 18 - a * 6;
    ctx.strokeStyle = SKIN; ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(hx, hy, 5.5, 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#e8392f'; rr(-17 + sway, shY, 34, torso + 6, 11); ctx.fill();
  ctx.fillStyle = '#ffe14a'; ctx.fillRect(-17 + sway, shY + torso * .55, 34, 4);
  ctx.font = `900 13px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText('EN', sway, shY + torso * .32);
  const hx = sway * 1.2, hy = shY - 13 * (1 - .3 * L);
  ctx.fillStyle = SKIN; ctx.beginPath(); ctx.arc(hx - 13, hy + 1, 3.5, 0, 7); ctx.arc(hx + 13, hy + 1, 3.5, 0, 7); ctx.fill();
  ctx.fillStyle = '#2b1b12'; ctx.beginPath(); ctx.arc(hx, hy, 13, 0, 7); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(hx - 13, hy - 2); ctx.lineTo(hx + 13, hy - 2); ctx.stroke();
  const fl = 8 + L * 14; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(hx + 4, hy - 2); ctx.quadraticCurveTo(hx + 10 + fl * .5, hy - 6 + Math.sin(t * 16) * 4, hx + 8 + fl, hy - 3 + Math.sin(t * 16 + 1) * 6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hx + 4, hy - 2); ctx.quadraticCurveTo(hx + 8 + fl * .5, hy + 2 + Math.sin(t * 15) * 4, hx + 4 + fl, hy + 4 + Math.sin(t * 15 + 2) * 6); ctx.stroke();
  ctx.restore();
}

// ---------- ヒーロー(横向き / テスト用) ----------
function seg(x, y, a, l) { return [x + Math.sin(a) * l, y + Math.cos(a) * l]; }
function limb(x0, y0, a1, a2, l1, l2, w, col, pants, foot) {
  const [x1, y1] = seg(x0, y0, a1, l1), [x2, y2] = seg(x1, y1, a2, l2);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = col; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  if (pants) { const [px, py] = seg(x0, y0, a1, l1 * .8); ctx.strokeStyle = pants; ctx.lineWidth = w * 1.25; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(px, py); ctx.stroke(); }
  if (foot) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(x2 + 3, y2, w * .8, w * .55, 0, 0, 7); ctx.fill(); }
}
function drawHero(x, y, s, o) {
  const t = o.t || 0;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (o.aura > 0) {
    const f = .75 + Math.random() * .25, g = ctx.createRadialGradient(0, -55, 5, 0, -55, 100);
    g.addColorStop(0, `rgba(255,220,80,${.8 * o.aura * f})`); g.addColorStop(.5, `rgba(255,90,20,${.5 * o.aura * f})`); g.addColorStop(1, 'rgba(255,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, -55, 100, 0, 7); ctx.fill();
  }
  let bob = 0, tilt = 0, la1, la2, lb1, lb2, aa1, aa2, ab1, ab2;
  const pose = o.pose;

  if (q.maxH >= .5) L.push({ s: w.exJa.replace(/「.*?」/, q.maxH >= .85 ? `「${w.ja[0]}…」` : '「 ？ 」'), c: '#fff' });
  else L.push({ s: q.maxH >= .3 ? 'もっと高く…(半分で回答解禁)' : '', c: '#7f86b8' });
  if (T.st === 'charge' && T.p >= .3) {
    const opt = q.opts[T.cell], sentence = w.exJa.replace(/「.*?」/, `「${opt.ja}」`);
    if (T.cell === q.ans) { let s = '✓ ' + sentence; if (T.p >= .7) { const r = relWord(w); s += `  ※近い単語:${r.en}=${r.ja}`; } L.push({ s, c: '#7dffa8', ok: true }); }
    else L.push({ s: '⚠ ' + corrupt(sentence, T.p >= .7 ? .6 : .32, Math.floor(time * 10)) + (T.p >= .7 ? ' …崩壊!' : ''), c: '#ff5a5a', bad: true });
  } else if (T.lockMsg > 0) L.push({ s: 'もっと高く跳んでから!(半分で解禁)', c: '#ff8a8a' });
  else if (T.st === 'charge') L.push({ s: '沈み込み中… 時間が倍速で減る!', c: '#ffb347' });
  else if (T.st === 'float' && T.h >= .5) L.push({ s: 'もう一度押して沈み込み → 離して叩きつけ!', c: '#ffe14a' });
  else L.push({ s: '沈むほど、選んだマスの意味が文に入って見える', c: '#7f86b8' });
  return L;
}

function drawTest() {
  const L = layoutTest(), q = T.q, t = time;
  const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#150b3a'); bg.addColorStop(.5, '#2a1766'); bg.addColorStop(1, '#0a1f4a');
  ctx.fillStyle = bg; ctx.fillRect(-20, -20, W + 40, H + 40);
  const vy = H * .42; ctx.lineWidth = 1.5;
  for (let i = -12; i <= 12; i++) { ctx.strokeStyle = `rgba(120,140,255,${.22 - Math.abs(i) * .01})`; ctx.beginPath(); ctx.moveTo(W / 2 + i * 14, vy); ctx.lineTo(W / 2 + i * W * .22, H); ctx.stroke(); }
  for (let i = 0; i < 12; i++) { const k = ((i + t * .5) % 12) / 12, y = vy + (H - vy) * k * k; ctx.strokeStyle = `rgba(120,140,255,${.05 + k * .2})`; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  const fs = Math.max(13, H * .028);
  txt(`Q ${T.i + 1}/${T.n}`, 12, H * .03, fs, '#fff', { align: 'left', stroke: 'rgba(0,0,0,.5)' });
  txt(`SCORE ${T.score}`, 12, H * .03 + fs * 1.25, fs, '#ffe14a', { align: 'left', stroke: 'rgba(0,0,0,.5)' });
  if (T.combo > 0) txt(`COMBO x${T.combo}`, 12, H * .03 + fs * 2.5, fs, '#7dffa8', { align: 'left', stroke: 'rgba(0,0,0,.5)' });
  txt('❤'.repeat(Math.max(0, T.hp)) + '♡'.repeat(Math.max(0, 3 - T.hp)), W - 60, H * .03, fs * 1.1, '#ff5468', { align: 'right' });
  txt(q.w.en, W / 2, H * .095, Math.min(H * .085, W * .13), '#fff', { stroke: '#4a22b8', sw: H * .012, maxW: W * .6 });
  { const bw = L.gw, bx = L.gx, by = H * .155, k = q.tl / QTIME;
    rr(bx, by, bw, 8, 4); ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fill();
    rr(bx, by, Math.max(8, bw * k), 8, 4); ctx.fillStyle = q.tl < 3 ? (Math.sin(t * 20) > 0 ? '#ff3b30' : '#ff8a8a') : (T.st === 'charge' ? '#ff9d2e' : '#7dffff'); ctx.fill();
    txt(q.tl.toFixed(1) + 's', bx + bw, by - 10, Math.max(11, H * .02), q.tl < 3 ? '#ff8a8a' : '#a9b0ff', { align: 'right' }); }

  const elimSet = new Set(q.elim.slice(0, [0, 0, 2, 3, 4][q.hintLv]));
  for (let i = 0; i < 6; i++) {
    const c = cellRect(L, i), sel = T.cell === i, elim = elimSet.has(i);
    if (q.res && i === q.pick) { // 叩き割ったマス
      ctx.fillStyle = 'rgba(0,0,0,.5)'; rr(c.x, c.y + c.h * .08, c.w, c.h * .92, 14); ctx.fill();
      ctx.strokeStyle = q.res.ok ? '#3df08f' : '#ff5a6e'; ctx.lineWidth = 3; ctx.stroke();
      txt(q.opts[i].ja, c.x + c.w / 2, c.y + c.h * .35, Math.min(c.h * .24, c.w * .2), q.res.ok ? '#3df08f' : '#ff8a8a', { maxW: c.w * .88 });
      continue;
    }
    const oy = (sel && T.st === 'charge') ? T.p * c.h * .14 : 0;
    let base = '#2f4fd0', top = '#5a7bff', edge = '#16237a';
    if (elim) { base = '#303549'; top = '#4a5068'; edge = '#1f2333'; }
    if (q.res && i === q.ans) { base = '#14a055'; top = '#3df08f'; edge = '#0a6a37'; }
    rr(c.x, c.y + oy + c.h * .08, c.w, c.h * .92, 14); ctx.fillStyle = edge; ctx.fill();
    const cg = ctx.createLinearGradient(0, c.y, 0, c.y + c.h); cg.addColorStop(0, top); cg.addColorStop(1, base);
    rr(c.x, c.y + oy, c.w, c.h * .92, 14); ctx.fillStyle = cg; ctx.fill();
    if (sel && !q.res) { ctx.save(); ctx.shadowColor = '#ffe14a'; ctx.shadowBlur = 22; ctx.lineWidth = 4; ctx.strokeStyle = '#ffe14a'; ctx.stroke(); ctx.restore(); }
    else { ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.stroke(); }
    txt(q.opts[i].ja, c.x + c.w / 2, c.y + oy + c.h * .27, Math.min(c.h * .26, c.w * .22), elim ? '#7d849e' : '#fff', { maxW: c.w * .88, stroke: elim ? null : 'rgba(0,0,30,.5)' });
    if (elim) { ctx.strokeStyle = 'rgba(255,90,100,.7)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(c.x + c.w * .3, c.y + c.h * .12); ctx.lineTo(c.x + c.w * .7, c.y + c.h * .8); ctx.moveTo(c.x + c.w * .7, c.y + c.h * .12); ctx.lineTo(c.x + c.w * .3, c.y + c.h * .8); ctx.stroke(); }
  }

  const base = Math.min(L.ch * .66, L.cw * .7), lift = T.h * L.ch * 1.05, sc = (base / 108) * (1 + T.h * .35), hyy = T.hy - lift;
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(T.hx, T.hy + 2, 30 * sc * (1 - T.h * .4), 6 * sc, 0, 0, 7); ctx.fill();
  let pose = 'idle';
  if (T.st === 'slam' || T.st === 'charge') pose = 'dive'; else if (T.h > .03) pose = 'jump';
  else if (T.st === 'result') pose = q.res.ok ? 'cheer' : 'down';
  const aura = T.st === 'charge' ? .35 + T.p * .65 : (T.st === 'slam' ? 1 : 0);
  if (T.st === 'slam') { ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 3; for (let i = 0; i < 6; i++) { const x = T.hx + (i - 2.5) * 10 * sc; ctx.beginPath(); ctx.moveTo(x, hyy - 140 * sc); ctx.lineTo(x, hyy - 20 * sc); ctx.stroke(); } }
  drawHero(T.hx, hyy, sc, { pose, t, aura });

  const P = L.panel; rr(P.x, P.y, P.w, P.h, 14); ctx.fillStyle = 'rgba(8,10,40,.6)'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#6c7bff'; ctx.stroke();
  const lines = infoLines(), lh = P.h / 4, lf = Math.min(lh * .6, P.w / 24);
  lines.forEach((ln, i) => {
    if (!ln.s) return; const jx = ln.bad ? (Math.random() - .5) * 5 : 0, jy = ln.bad ? (Math.random() - .5) * 3 : 0;
    txt(ln.s, P.x + 14 + jx, P.y + lh * (i + .5) + jy, lf, ln.c, { align: 'left', weight: '700', maxW: P.w - 28, stroke: ln.ok ? 'rgba(0,120,60,.6)' : null });
  });

  drawHintButton(L, q); drawAnswerButton(L);
  const fz = Math.max(10, Math.min(H * .021, W * .028)), mw = W - L.br * 5.2;
  if (mw > 120) {
    txt(IS_TOUCH ? 'マスをタップで移動' : '←↑↓→ 移動 / Z 連打=ヒント', W / 2, H - L.br * 1.75, fz, '#a9b0ff', { maxW: mw });
    txt(IS_TOUCH ? '右:押して上昇→離す→もう一度押して溜め→離す' : 'Space:押して上昇→離す→もう一度押して溜め→離す', W / 2, H - L.br * .8, fz, '#a9b0ff', { maxW: mw });
  }
}
function drawHintButton(L, q) {
  const { x, y } = L.hint, r = L.br * (1 - q.padHit * .12), g = q.gauge / 100;
  const gg = ctx.createRadialGradient(x - r * .3, y - r * .3, r * .1, x, y, r); gg.addColorStop(0, '#ffc15a'); gg.addColorStop(1, '#e8590c');
  ctx.save(); ctx.shadowColor = 'rgba(255,140,40,.8)'; ctx.shadowBlur = 10 + q.padHit * 30; ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore();
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(x, y, r + 8, 0, 7); ctx.stroke();
  ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.strokeStyle = g > .75 ? '#ff3b30' : '#ffe14a'; ctx.beginPath(); ctx.arc(x, y, r + 8, -Math.PI / 2, -Math.PI / 2 + g * 6.283); ctx.stroke();
  for (let i = 0; i < 4; i++) { const a = -Math.PI / 2 + (i + 1) * 1.5708; ctx.fillStyle = q.hintLv > i ? '#fff' : 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(x + Math.cos(a) * (r + 8), y + Math.sin(a) * (r + 8), 5, 0, 7); ctx.fill(); }
  txt('🥊', x, y - r * .22, r * .8, '#fff'); txt('HINT', x, y + r * .5, r * .3, '#fff', { stroke: 'rgba(120,40,0,.8)' });
  txt('Lv' + q.hintLv, x, y - r - 24, Math.max(12, r * .3), q.lvFlash > 0 ? '#fff' : '#ffe14a', { stroke: 'rgba(0,0,0,.6)' });
}
function drawAnswerButton(L) {
  const { x, y } = L.ans, r = L.br, st = T.st, unlocked = T.h >= .5 && (st === 'float' || st === 'charge' || st === 'rise'), pulse = unlocked ? Math.sin(time * 10) * .5 + .5 : 0;
  const gg = ctx.createRadialGradient(x - r * .3, y - r * .3, r * .1, x, y, r); gg.addColorStop(0, unlocked ? '#ff9d7a' : '#6ae59a'); gg.addColorStop(1, unlocked ? '#d1301f' : '#138a52');
  ctx.save(); ctx.shadowColor = unlocked ? `rgba(255,120,60,${.5 + pulse * .5})` : 'rgba(60,200,120,.5)'; ctx.shadowBlur = 10 + pulse * 26;
  ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore();
  if (T.p > 0) { ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.clip(); ctx.fillStyle = 'rgba(255,230,60,.7)'; ctx.fillRect(x - r, y + r - 2 * r * T.p, 2 * r, 2 * r * T.p); ctx.restore(); }
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(x, y, r + 8, 0, 7); ctx.stroke();
  ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.strokeStyle = unlocked ? '#ffe14a' : '#fff'; ctx.beginPath(); ctx.arc(x, y, r + 8, -Math.PI / 2, -Math.PI / 2 + T.h * 6.283); ctx.stroke();
  ctx.fillStyle = '#ffe14a'; ctx.beginPath(); ctx.arc(x, y + r + 8, 6, 0, 7); ctx.fill();
  const down = st === 'charge' || (unlocked && st === 'float');
  txt(down ? '⬇' : '⬆', x, y - r * .2, r * .8, '#fff');
  txt(st === 'charge' ? '離せ!' : (down ? 'SLAM' : 'JUMP'), x, y + r * .5, r * .3, '#fff', { stroke: 'rgba(0,0,0,.6)' });
  txt(unlocked ? '回答OK' : 'ロック中', x, y - r - 24, Math.max(12, r * .28), unlocked ? '#ffb347' : '#a9b0ff', { stroke: 'rgba(0,0,0,.6)' });
}

// ===================================================================
//  タイトル / 結果
// ===================================================================
function drawTitle() {
  drawRun();
  ctx.fillStyle = 'rgba(8,10,40,.5)'; ctx.fillRect(0, 0, W, H);
  const k = 1 + Math.sin(time * 3) * .02;
  txt('ENGLISH DASH', W / 2, H * .2, Math.min(H * .14, W * .13) * k, '#fff', { stroke: '#ff5a1f', sw: H * .02, maxW: W * .94 });
  txt('前へ倒せ! 英語が流れてくる!', W / 2, H * .32, Math.min(H * .05, W * .055), '#ffe14a', { stroke: 'rgba(0,0,0,.6)', maxW: W * .94 });
  const fs = Math.min(H * .034, W * .04);
  ['① 前に倒し続けて加速! レーン移動で単語カードを取れ',
   '② QUIZゲート:正しい意味をくぐればBOOST / 外せばCRASH',
   '③ 1000mでテスト。ライフ3・制限時間つき6択',
   '④ ジャンプして浮いて、沈み込んで、マスに叩きつけろ!',
  ].forEach((s, i) => txt(s, W / 2, H * .44 + i * fs * 1.6, fs, '#fff', { stroke: 'rgba(0,0,0,.6)', maxW: W * .94, weight: '700' }));
  if (Math.sin(time * 5) > -.3) txt(IS_TOUCH ? 'TAP TO START' : 'PRESS ENTER / SPACE / CLICK', W / 2, H * .84, Math.min(H * .06, W * .06), '#fff', { stroke: '#ff5a1f', maxW: W * .94 });
  if (best) txt('BEST ' + best, W / 2, H * .93, H * .03, '#ffe14a');
}
function drawResult() {
  drawTest();
  ctx.fillStyle = 'rgba(6,8,30,.88)'; ctx.fillRect(-20, -20, W + 40, H + 40);
  const acc = (R.gatesOK + T.correct) / Math.max(1, R.gatesN + T.n);
  const rank = T.over ? 'C' : (acc >= .9 && R.time < 70 ? 'S' : acc >= .75 ? 'A' : acc >= .5 ? 'B' : 'C');
  const rc = { S: '#ffe14a', A: '#7dffa8', B: '#9fe3ff', C: '#ff9d8a' }[rank], total = R.score + T.score, fz = Math.min(H * .036, W * .045);
  txt(T.over ? 'GAME OVER' : 'CLEAR!', W / 2, H * .09, Math.min(H * .08, W * .1), T.over ? '#ff5468' : '#fff', { stroke: '#4a22b8' });
  txt(rank, W / 2, H * .23, Math.min(H * .17, W * .25), rc, { stroke: 'rgba(0,0,0,.6)', sw: H * .02 });
  txt(`TOTAL ${total}`, W / 2, H * .36, Math.min(H * .055, W * .07), '#fff');
  txt(`RUN ${fmtT(R.time)}  ゲート ${R.gatesOK}/${R.gatesN}  最大COMBO ${R.maxCombo}`, W / 2, H * .43, fz, '#9fe3ff', { maxW: W * .94 });
  txt(`TEST 正解 ${T.correct}/${T.n}  最大COMBO ${T.maxCombo}`, W / 2, H * .43 + fz * 1.4, fz, '#9fe3ff', { maxW: W * .94 });
  txt(`BEST ${best}`, W / 2, H * .43 + fz * 2.8, fz, '#ffe14a');
  const miss = [...new Set([...R.weak, ...T.missed])];
  if (miss.length) {
    txt('復習しよう', W / 2, H * .6, fz, '#ff9d8a');
    miss.slice(0, 6).forEach((w, i) => txt(`${w.en} = ${w.ja}`, W / 2, H * .6 + fz * 1.4 * (i + 1), fz, '#fff', { weight: '700', maxW: W * .9 }));
  } else txt('パーフェクト!', W / 2, H * .64, H * .05, '#7dffa8');
  if (Math.sin(time * 5) > -.3) txt(IS_TOUCH ? 'TAP でもう一度走る' : 'ENTER / SPACE / CLICK でもう一度', W / 2, H * .95, Math.min(H * .04, W * .05), '#fff', { stroke: '#ff5a1f', maxW: W * .94 });
}

// ---------- メインループ ----------
let last = performance.now();
function frame(now) {
  const rdt = Math.min(.05, (now - last) / 1000); last = now; time += rdt; tPhase += rdt;
  let dt = rdt;
  if (hitstop > 0) { hitstop -= rdt; dt = 0; }
  if (phase === 'title' || phase === 'result') {
    for (const k of kQueue) if ((k === 'Enter' || k === 'Space') && tPhase > .5) { advanceScreen(); break; }
    kQueue = [];
  }
  if (dt > 0) {
    if (phase === 'title' || phase === 'run' || phase === 'gate') updateRun(dt);
    else if (phase === 'test') updateTest(dt);
    updFx(dt);
  }
  shake = Math.max(0, shake - rdt * 3); kick = Math.max(0, kick - rdt * 5); flash = Math.max(0, flash - rdt * 2.5);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake * 16, (Math.random() - .5) * shake * 16);
  if (kick > 0) { const z = 1 + kick * .035; ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2); }
  if (phase === 'title') drawTitle();
  else if (phase === 'run' || phase === 'gate') { drawRun(); drawFx(); drawRunHUD(); }
  else if (phase === 'test') { drawTest(); drawFx(); }
  else if (phase === 'result') drawResult();
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = `rgba(${flashCol},${Math.min(1, flash)})`; ctx.fillRect(0, 0, W, H); }
  { const m = muteBtn(); ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 7); ctx.fill(); txt(muted ? '🔇' : '🔊', m.x, m.y + 1, m.r, '#fff'); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__game = { get phase() { return phase; }, get R() { return R; }, get T() { return T; }, startRun, startTest, setDist(d) { R.dist = d; } };
})();
</script>
</body>
